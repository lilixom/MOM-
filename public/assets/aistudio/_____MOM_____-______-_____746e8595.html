<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="昇兴三片罐 MOM 系统 · 全系统可交互 HTML 原型（332 个菜单页面，离线可用）">
<title>昇兴三片罐 MOM 系统 · 全系统交互原型</title>
<style>/* app.css */

/* ============================================================
   昇兴股份 MES · 质量管理 → 数据中心 → 质量报表 交互原型
   app.css —— 企业级蓝白（Ant Design 气质），离线可用，无外链字体/图片
   ============================================================ */

/* ---------- 1. 设计令牌 ---------- */
:root{
  --brand:#062767;          /* 品牌主色 / 顶栏 / 侧栏 */
  --brand-2:#10429c;        /* 侧栏当前项 */
  --brand-3:#0b3a82;        /* 表格操作文字 */
  --link:#1664ff;           /* 链接态 */
  --topnav:#062767;
  --sidenav:#062767;
  --bg:#f2f3f5;
  --card:#ffffff;
  --bd:#e5e6eb;
  --bd-2:#f0f0f0;
  --bd-3:#d9d9d9;
  --t1:#1d2129;
  --t2:#4e5969;
  --t3:#86909c;
  --th:#666b73;
  --ok:#0aa06e;
  --ok-bg:#e6fffb;
  --success:#52c41a;
  --warn:#faad14;
  --danger:#e0263b;
  --danger-bg:#fff1f0;
  --sel:#f0f6ff;
  --hover:#f7f9fc;
  --r:2px;
  --r-card:2px;
  --shadow:0 1px 2px rgba(6,39,103,.04),0 2px 8px rgba(0,0,0,.04);
  --font:"Microsoft YaHei","PingFang SC",-apple-system,"Segoe UI",sans-serif;
}

/* ---------- 2. 基础 ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--t1);
  font-family:var(--font);font-size:13px;line-height:1.5;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p,ul,li{margin:0;padding:0}
ul{list-style:none}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--link);text-decoration:none}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--t1)}
svg{display:block}
:focus{outline:none}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c9cdd4;border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#a9b0ba;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- 3. 浏览器式页签条 ---------- */
.ptabs{
  height:34px;display:flex;align-items:flex-end;gap:0;
  background:#dfe3ea;padding:0 8px;user-select:none;
  border-bottom:1px solid #cfd5de;position:relative;z-index:30;
}
.ptabs-home{display:flex;align-items:center;justify-content:center;width:26px;height:24px;color:#5b6371;margin-bottom:4px}
.ptabs-scroll{display:flex;align-items:flex-end;gap:2px;overflow-x:auto;overflow-y:hidden;flex:1;min-width:0;scrollbar-width:none}
.ptabs-scroll::-webkit-scrollbar{height:0}
.ptab{
  display:flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 12px;max-width:220px;
  background:#eef0f4;border:1px solid #cfd5de;border-bottom:0;border-radius:6px 6px 0 0;
  font-size:12px;color:#4e5969;cursor:pointer;position:relative;top:1px;flex:0 0 auto;
}
.ptab:hover{background:#f6f7f9}
.ptab.active{background:#fff;color:#1d2129;font-weight:600;border-color:#cfd5de;box-shadow:inset 0 2px 0 var(--brand)}
.ptab-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.ptab-x{
  width:16px;height:16px;flex:0 0 16px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;font-size:13px;line-height:1;color:#86909c;
}
.ptab-x:hover{background:#d8dde5;color:#1d2129}
.ptabs-plus{
  width:26px;height:24px;margin:0 4px 4px 6px;border-radius:4px;color:#4e5969;font-size:17px;line-height:1;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.ptabs-plus:hover{background:#cfd5de;color:#1d2129}

/* ---------- 4. 应用外壳 ---------- */
.app{height:calc(100% - 34px);display:flex;flex-direction:column;min-width:0}
.topbar{
  height:64px;flex:0 0 64px;background:var(--topnav);color:#fff;
  display:flex;align-items:center;padding:0 20px 0 14px;position:relative;z-index:20;
  box-shadow:0 2px 8px rgba(6,39,103,.28);
}
.topbar-l{display:flex;align-items:center;gap:14px;flex:1 1 0;min-width:0}
.brand{display:flex;align-items:center;gap:9px;background:#fff;border-radius:2px;padding:4px 10px 4px 6px}
.brand-logo{width:34px;height:26px;position:relative;display:block;flex:0 0 34px}
.brand-logo i{position:absolute;left:3px;top:3px;width:28px;height:7px;background:#e4003e;border-radius:1px}
.brand-logo i.b1{transform:rotate(38deg);top:9.5px}
.brand-logo i.b2{transform:rotate(-38deg);top:9.5px}
.brand-txt{display:flex;flex-direction:column;line-height:1.15}
.brand-txt b{font-size:15px;font-weight:800;color:#0d2a5c;letter-spacing:.5px}
.brand-txt small{font-size:7px;color:#0d2a5c;letter-spacing:1.4px;transform:scale(.94);transform-origin:left center}
.org-chip{
  font-size:12px;color:#c9d6ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border-left:1px solid rgba(255,255,255,.22);padding-left:14px;
}
.topbar-title{
  font-size:20px;font-weight:500;letter-spacing:2px;color:#fff;white-space:nowrap;
  position:absolute;left:50%;transform:translateX(-50%);pointer-events:none;
}
.topbar-r{display:flex;align-items:center;gap:16px;flex:1 1 0;justify-content:flex-end}
.greet{font-size:13px;color:#e8eefb;white-space:nowrap}
.tb-icon{position:relative;width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:#dbe6fb;border-radius:2px}
.tb-icon:hover{background:rgba(255,255,255,.14);color:#fff}
.tb-dot{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:#faad14;border:1px solid var(--topnav)}
.avatar{
  width:32px;height:32px;border-radius:50%;flex:0 0 32px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#7ea6f0,#3f6fd0);color:#fff;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.45);
}

.shell{flex:1 1 auto;display:flex;min-height:0;min-width:0}

/* ---------- 5. 侧栏 ---------- */
.sidebar{
  width:186px;flex:0 0 186px;background:var(--sidenav);color:#dbe4f5;
  overflow-y:auto;overflow-x:hidden;padding:8px 0 24px;
}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border:0}
.side-group{position:relative}
.side-head{
  width:100%;display:flex;align-items:center;gap:9px;height:46px;padding:0 14px 0 16px;
  color:#dbe4f5;font-size:14px;text-align:left;position:relative;
}
.side-head:hover{background:rgba(255,255,255,.07)}
.side-head.active{background:var(--brand-2);color:#fff;font-weight:600}
.side-head.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#4f8ff7}
.side-ico{width:17px;height:17px;flex:0 0 17px;opacity:.92}
.side-txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-caret{transition:transform .18s;opacity:.7;flex:0 0 10px}
.side-head.open .side-caret{transform:rotate(90deg)}
.side-sub{display:none;background:rgba(0,0,0,.14);padding:2px 0}
.side-group.open .side-sub{display:block}
.side-item{
  display:flex;align-items:center;height:38px;padding:0 14px 0 42px;font-size:13px;color:#c3d1ea;
  text-align:left;width:100%;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.side-item:hover{background:rgba(255,255,255,.09);color:#fff}
.side-item.active{background:var(--brand-2);color:#fff;font-weight:600}
.side-item.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#7fb0ff}
.side-item .dot{width:5px;height:5px;border-radius:50%;background:#8aa5cf;margin-right:8px;flex:0 0 5px}
.side-item.active .dot{background:#fff}

/* ---------- 6. 主内容区 ---------- */
.main{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.view{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 16px 24px;scroll-behavior:auto}
.view:focus{outline:none}

/* ---------- 7. 业务页签条（MES 工作台） ---------- */
.biztabs{
  flex:0 0 auto;display:flex;align-items:center;height:40px;background:#fff;
  border-bottom:1px solid var(--bd);padding:0 8px;min-width:0;
}
.biztabs-tools{display:flex;align-items:center;gap:2px;padding-right:8px;margin-right:4px;border-right:1px solid var(--bd-2);flex:0 0 auto}
.biztab-toggle{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:2px;color:#4e5969}
.biztab-toggle:hover{background:#f2f3f5;color:var(--brand)}
.biztabs-scroll{display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;flex:1 1 auto;min-width:0;height:100%;scrollbar-width:thin}
.biztabs-scroll::-webkit-scrollbar{height:4px}
.biztabs-scroll::-webkit-scrollbar-thumb{background:#d3d8e0;border-radius:3px}
.biztab{
  display:flex;align-items:center;gap:4px;height:100%;padding:0 10px 0 14px;flex:0 0 auto;
  font-size:13px;color:var(--t2);position:relative;border-right:1px solid var(--bd-2);white-space:nowrap;
}
.biztab:hover{background:#f7f8fa;color:var(--brand)}
.biztab.active{color:var(--brand);font-weight:600}
.biztab.active::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--brand);border-radius:1px}
.biztab.off{color:#a9afb8}
.biztab-x{width:15px;height:15px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:12px;color:#a9afb8;line-height:1}
.biztab:hover .biztab-x{color:var(--t2)}
.biztab-x:hover{background:#e5e6eb;color:var(--t1)}
.biztabs-mag{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#4e5969;border-radius:2px;flex:0 0 auto}
.biztabs-mag:hover{background:#f2f3f5;color:var(--brand)}
.biztabs.collapsed .biztabs-scroll{display:none}
.biztabs-empty{font-size:12px;color:var(--t3);padding-left:4px}

/* ---------- 8. 卡片 / 通用排版 ---------- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r-card);box-shadow:var(--shadow);min-width:0}
.card+.card{margin-top:12px}
.card-hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd-2);min-height:44px}
.card-title{font-size:14px;font-weight:600;color:var(--t1);white-space:nowrap}
.card-title small{font-weight:400;color:var(--t3);font-size:12px;margin-left:8px}
.card-hd-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.card-bd{padding:16px}
.card-bd.tight{padding:12px 16px}

.crumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t3);padding:2px 0 10px;flex-wrap:wrap}
.crumb a{color:var(--t2)}
.crumb a:hover{color:var(--brand);text-decoration:underline}
.crumb .sp{color:#c9cdd4}
.crumb .cur{color:var(--t1)}

.page-hd{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.page-hd h2{font-size:17px;font-weight:600;color:var(--t1);display:flex;align-items:center;gap:8px}
.page-hd .sub{font-size:12px;color:var(--t3);margin-top:4px;line-height:1.6}
.page-hd-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:2px;font-size:12px;background:#eef2f8;color:var(--brand)}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand)}

/* ---------- 9. 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;height:30px;padding:0 13px;
  border-radius:var(--r);border:1px solid transparent;font-size:13px;line-height:1;white-space:nowrap;
  transition:background .15s,border-color .15s,color .15s;cursor:pointer;user-select:none;
}
.btn svg{flex:0 0 auto}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
.btn-primary:hover{background:#0a367f;border-color:#0a367f}
.btn-primary:active{background:#05205a}
.btn-default{background:#fff;border-color:var(--bd-3);color:var(--t1)}
.btn-default:hover{color:var(--brand);border-color:var(--brand);background:#f5f8ff}
.btn-danger{background:#fff;border-color:var(--danger);color:var(--danger)}
.btn-danger:hover{background:var(--danger-bg)}
.btn-text{background:transparent;border-color:transparent;color:var(--brand);padding:0 8px}
.btn-text:hover{background:#eef2f8}
.btn-sm{height:26px;padding:0 9px;font-size:12px}
.btn-icon{width:30px;height:30px;padding:0;background:#fff;border:1px solid var(--bd-3);color:var(--t2)}
.btn-icon:hover{color:var(--brand);border-color:var(--brand);background:#f5f8ff}
.btn[disabled]{opacity:.5;cursor:not-allowed;background:#f2f3f5;border-color:var(--bd);color:var(--t3)}
.btn-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- 10. 标签 ---------- */
.tag{
  display:inline-flex;align-items:center;gap:3px;height:21px;padding:0 7px;border-radius:2px;
  font-size:11px;line-height:1;white-space:nowrap;border:1px solid transparent;
}
.tag-ok,.tag-合格,.tag-绿色{background:#e6fffb;color:#0aa06e;border-color:#c3f2e6}
.tag-err,.tag-不合格{background:#fff1f0;color:#e0263b;border-color:#ffd6d6}
.tag-warn,.tag-待检,.tag-待处理{background:#fffbe6;color:#d48806;border-color:#ffe9a8}
.tag-gray,.tag-停用{background:#f2f3f5;color:#6b7280;border-color:#e5e6eb}
.tag-blue,.tag-处理中{background:#eef2f8;color:#0b3a82;border-color:#d8e2f5}
.tag-cyan{background:#e8f7ff;color:#0f6f9c;border-color:#c9e9f7}
.tag-已关闭{background:#f2f3f5;color:#6b7280;border-color:#e5e6eb}

/* ---------- 11. 表单控件 ---------- */
.inp,.sel{
  height:30px;border:1px solid var(--bd-3);border-radius:var(--r);background:#fff;
  padding:0 9px;color:var(--t1);width:100%;min-width:0;
}
.inp::placeholder{color:#a9afb8}
.inp:hover,.sel:hover{border-color:#9fb3d1}
.inp:focus,.sel:focus{border-color:var(--brand);box-shadow:0 0 0 2px rgba(6,39,103,.08);outline:none}
.sel{appearance:none;padding-right:24px;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%23a9afb8' stroke-width='1.2'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 8px center;cursor:pointer}
textarea.inp{height:auto;padding:6px 9px;resize:vertical;line-height:1.5}
.inp-sm,.sel-sm{height:26px;font-size:12px}
.form-item{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.form-item>label{font-size:12px;color:var(--t2)}
.form-item>label .req{color:var(--danger);margin-right:2px}
.form-item .err{font-size:11px;color:var(--danger);min-height:14px}
.form-item.invalid .inp,.form-item.invalid .sel{border-color:var(--danger);background:#fffafa}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.form-grid .full{grid-column:1/-1}
.cb{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--t2);white-space:nowrap}
input[type=checkbox],input[type=radio]{
  width:14px;height:14px;margin:0;accent-color:var(--brand);cursor:pointer;flex:0 0 14px;
}

/* ---------- 12. 筛选区 ---------- */
.filters{position:relative}
.filters-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 20px;align-items:start;padding-right:250px}
.filters.empty .f-hidden{display:none}
.f-item{display:flex;align-items:center;gap:0;min-width:0}
.f-label{
  width:90px;flex:0 0 90px;text-align:right;padding-right:10px;color:#595f6b;
  font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.f-ctl{display:flex;min-width:0;flex:1 1 auto;max-width:440px}
.f-ctl .combo-op{
  height:30px;border:1px solid var(--bd-3);border-right:0;border-radius:var(--r) 0 0 var(--r);
  width:96px;flex:0 0 96px;background:#fff;color:var(--t2);padding:0 6px;appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%23a9afb8' stroke-width='1.2'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 6px center;
}
.f-ctl .combo-ctl{border-radius:0 var(--r) var(--r) 0;flex:1 1 auto;min-width:0}
.f-ctl .combo-ctl.sel{width:100%}
.f-item.solo .f-ctl .combo-ctl{border-radius:var(--r)}
.f-tools{
  position:absolute;right:0;top:0;display:flex;align-items:center;gap:8px;
}
.icon-btn{
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--bd-3);border-radius:var(--r);background:#fff;color:var(--t2);
}
.icon-btn:hover{color:var(--brand);border-color:var(--brand);background:#f5f8ff}
.filters.folded .filters-grid{display:none}
.filters.folded .f-tools{position:static;justify-content:flex-end;margin-left:auto}
.filters.folded .f-line{display:flex;align-items:center;gap:10px}
.folded-note{font-size:12px;color:var(--t3)}

/* ---------- 13. KPI ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0}
.kpi{
  background:#fff;border:1px solid var(--bd);border-radius:var(--r-card);box-shadow:var(--shadow);
  padding:12px 16px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;
}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand);opacity:.85}
.kpi.alt::after{background:var(--ok)}
.kpi.alt-2::after{background:var(--warn)}
.kpi-l{font-size:12px;color:var(--t3);display:flex;align-items:center;gap:6px}
.kpi-v{font-size:24px;font-weight:700;color:var(--t1);line-height:1.15;letter-spacing:.3px}
.kpi-v small{font-size:12px;font-weight:400;color:var(--t3);margin-left:4px}
.kpi-d{font-size:12px;color:var(--t3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.delta{display:inline-flex;align-items:center;gap:2px;font-weight:600}
.delta.up{color:var(--danger)}
.delta.down{color:var(--ok)}
.delta.flat{color:var(--t3)}
.kpi-d .vs{color:#a9afb8}

/* ---------- 14. 分栏/图表 ---------- */
.chart-grid{display:grid;grid-template-columns:1fr;gap:12px}
.chart-grid.two{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.chart-hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--bd-2)}
.chart-hd .card-title{font-size:13px}
.chart-hd-r{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chart-host{width:100%;min-height:230px;padding:8px 10px 4px;position:relative}
.chart-host svg{width:100%;height:auto;display:block;overflow:visible}
.chart-empty{display:flex;align-items:center;justify-content:center;height:220px;color:var(--t3);font-size:12px}
.legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:2px 16px 12px;font-size:12px;color:var(--t2)}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
.seg{display:inline-flex;border:1px solid var(--bd-3);border-radius:var(--r);overflow:hidden;background:#fff}
.seg button{height:26px;padding:0 11px;font-size:12px;color:var(--t2);border-right:1px solid var(--bd-3)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--brand);color:#fff;font-weight:500}
.seg button:not(.on):hover{background:#f5f8ff;color:var(--brand)}
.mini-badge{font-size:11px;color:var(--t3);background:#f2f3f5;border-radius:2px;padding:2px 6px}
.cap-badges{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 12px}
.cap-badge{border:1px solid var(--bd);border-radius:2px;background:#fafbfc;padding:5px 9px;font-size:11px;color:var(--t2)}
.cap-badge b{display:block;font-size:14px;color:var(--brand);margin-top:1px}

/* ---------- 15. 表格 ---------- */
.table-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tbl-wrap{width:100%;overflow:auto;border-top:1px solid var(--bd-2);position:relative}
.tbl-wrap.scroll-y{max-height:520px}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;color:var(--t1);table-layout:fixed}
table.tbl th,table.tbl td{
  padding:0 10px;height:44px;text-align:left;vertical-align:middle;
  border-bottom:1px solid #f2f3f5;background:#fff;
}
table.tbl th{
  background:#fafafa;color:var(--th);font-weight:600;font-size:12px;height:40px;
  border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:3;
}
table.tbl th::after{content:"";position:absolute;right:0;top:8px;bottom:8px;width:1px;background:#f0f0f0}
table.tbl th:last-child::after{display:none}
table.tbl tbody tr:nth-child(even) td{background:#fcfcfd}
table.tbl tbody tr:hover td{background:var(--hover)}
table.tbl tbody tr.sel td{background:var(--sel)}
table.tbl tbody tr.sel:hover td{background:#e8f1ff}
table.tbl tbody tr.odd td{background:#fff}
.tbl-empty td{height:auto}
.th-in{display:flex;align-items:center;gap:4px;position:relative;min-width:0}
.th-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th-cbtn{
  width:16px;height:16px;display:flex;align-items:center;justify-content:center;color:#a9afb8;flex:0 0 16px;
  border-radius:2px;margin-left:auto;
}
.th-cbtn:hover{background:#eef2f8;color:var(--brand)}
.th-cbtn.on{color:var(--brand)}
.sort-ind{display:flex;flex-direction:column;gap:0;margin-left:2px;flex:0 0 8px}
.sort-ind i{width:0;height:0;border-left:3.5px solid transparent;border-right:3.5px solid transparent;display:block}
.sort-ind i.up{border-bottom:5px solid #c9cdd4}
.sort-ind i.dn{border-top:5px solid #c9cdd4}
th.sort-asc .sort-ind i.up{border-bottom-color:var(--brand)}
th.sort-desc .sort-ind i.dn{border-top-color:var(--brand)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{background:#f2f4f7}
.cell-ellip{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-strong{color:var(--t1)}
.cell-sub{color:var(--t3)}
td.col-op,th.col-op{position:sticky;right:0;z-index:4;background:#fafafa;box-shadow:-6px 0 6px -6px rgba(6,39,103,.12)}
td.col-op{background:#fff}
tbody tr:nth-child(even) td.col-op{background:#fcfcfd}
tbody tr:hover td.col-op{background:var(--hover)}
tbody tr.sel td.col-op{background:var(--sel)}
.row-actions{display:flex;align-items:center;gap:12px;white-space:nowrap}
.act{color:var(--brand-3);font-size:12px;display:inline-flex;align-items:center;gap:3px}
.act:hover{color:var(--link);text-decoration:underline}
.act.danger{color:var(--danger)}
.act.disabled{color:#c9cdd4;cursor:not-allowed;text-decoration:none}
.chk-cell{width:44px;min-width:44px}
.col-op .gear{color:#86909c;display:inline-flex;margin-left:auto}
.col-op .gear:hover{color:var(--brand)}
td.col-op .th-in{justify-content:flex-start}
.req-tip{display:inline-block;width:3px;height:12px;background:var(--danger);border-radius:1px;margin-right:4px;vertical-align:-1px}

/* 分页 */
.pager{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:10px 16px;flex-wrap:wrap;font-size:12px;color:var(--t2);background:#fff;border-top:1px solid var(--bd-2)}
.pg-total{color:var(--t2)}
.pg-total b{color:var(--t1)}
.pg-list{display:flex;align-items:center;gap:2px}
.pg-btn{
  min-width:26px;height:26px;padding:0 6px;border:1px solid transparent;border-radius:2px;
  display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:12px;
}
.pg-btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.pg-btn:disabled{color:#c9cdd4;cursor:not-allowed}
.pg-btn.on{border-color:var(--brand);color:var(--brand);font-weight:600}
.pg-dots{color:var(--t3);padding:0 2px}
.pg-size{margin-left:4px}
.pg-size .sel{height:26px;width:88px;font-size:12px}
.pg-jump{display:flex;align-items:center;gap:6px}
.pg-jump .inp{width:46px;height:26px;text-align:center;padding:0 4px;font-size:12px}

/* 骨架屏 / 空态*/
.sk-row{display:flex;align-items:center;gap:12px;padding:0 10px;height:44px;border-bottom:1px solid #f2f3f5}
.sk{height:10px;border-radius:2px;background:linear-gradient(90deg,#eef0f3 25%,#f6f7f9 37%,#eef0f3 63%);background-size:400% 100%;animation:sk 1.2s ease-in-out infinite}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:38px 12px;color:var(--t3);font-size:12px;text-align:center}
.empty .ill{width:92px;height:64px;opacity:.85}
.empty b{color:var(--t2);font-size:13px;font-weight:500}
.empty .btn{margin-top:2px}

/* ---------- 16. 弹层：modal / drawer / popover / toast ---------- */
.layer-mask{position:fixed;inset:0;background:rgba(20,26,38,.45);z-index:100;display:flex;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(10px);opacity:.6}to{transform:none;opacity:1}}
@keyframes slideLeft{from{transform:translateX(24px);opacity:.5}to{transform:none;opacity:1}}
.modal{
  margin:auto;background:#fff;border-radius:var(--r);box-shadow:0 8px 32px rgba(0,0,0,.2);
  width:520px;max-width:calc(100vw - 40px);max-height:calc(100vh - 80px);display:flex;flex-direction:column;
  animation:slideUp .18s ease;
}
.modal-hd{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--bd-2)}
.modal-hd h3{font-size:15px;font-weight:600;color:var(--t1)}
.modal-x{margin-left:auto;width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--t3);border-radius:2px}
.modal-x:hover{background:#f2f3f5;color:var(--t1)}
.modal-bd{padding:18px;overflow-y:auto;flex:1 1 auto;min-height:0}
.modal-ft{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--bd-2);background:#fcfcfd}
.modal-ft .ft-l{margin-right:auto;font-size:12px;color:var(--t3)}

.layer-drawer{position:fixed;inset:0;background:rgba(20,26,38,.4);z-index:100;display:flex;justify-content:flex-end;animation:fade .16s ease}
.drawer{width:520px;max-width:96vw;background:#fff;height:100%;display:flex;flex-direction:column;box-shadow:-8px 0 28px rgba(0,0,0,.18);animation:slideLeft .2s ease}
.drawer-hd{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--bd-2)}
.drawer-hd h3{font-size:15px;font-weight:600}
.drawer-bd{padding:16px 18px;overflow-y:auto;flex:1 1 auto;min-height:0}
.drawer-ft{padding:12px 18px;border-top:1px solid var(--bd-2);display:flex;justify-content:flex-end;gap:8px;background:#fcfcfd}
.dl{display:grid;grid-template-columns:104px 1fr;gap:10px 12px;font-size:13px}
.dl dt{color:var(--t3);text-align:right}
.dl dd{margin:0;color:var(--t1);word-break:break-all}
.drawer-sec{margin-top:18px}
.drawer-sec h4{font-size:13px;font-weight:600;margin-bottom:8px;padding-left:8px;border-left:3px solid var(--brand);line-height:1.2}
.mini-tbl{width:100%;border-collapse:collapse;font-size:12px}
.mini-tbl th,.mini-tbl td{border:1px solid var(--bd-2);padding:6px 8px;text-align:left}
.mini-tbl th{background:#fafafa;color:var(--th);font-weight:600}
.tl{display:flex;flex-direction:column;gap:0;font-size:12px}
.tl-i{display:flex;gap:10px;padding-bottom:14px;position:relative}
.tl-i::before{content:"";position:absolute;left:4px;top:12px;bottom:0;width:1px;background:var(--bd)}
.tl-i:last-child::before{display:none}
.tl-d{width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--brand);flex:0 0 9px;margin-top:4px;position:relative;z-index:1}
.tl-c b{color:var(--t1);font-weight:600;display:block;margin-bottom:2px}
.tl-c span{color:var(--t3)}

.popover{
  position:fixed;z-index:120;background:#fff;border:1px solid var(--bd);border-radius:var(--r);
  box-shadow:0 6px 20px rgba(0,0,0,.14);padding:10px;min-width:180px;max-width:340px;animation:slideUp .12s ease;
}
.pop-hd{font-size:12px;font-weight:600;color:var(--t1);padding:2px 2px 8px;display:flex;align-items:center;gap:6px}
.pop-list{max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.pop-item{display:flex;align-items:center;gap:7px;padding:6px 6px;border-radius:2px;font-size:12px;color:var(--t2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop-item:hover{background:#f5f8ff;color:var(--brand)}
.pop-item.on{color:var(--brand);font-weight:600}
.pop-sep{height:1px;background:var(--bd-2);margin:6px 0}
.pop-ft{display:flex;align-items:center;justify-content:flex-end;gap:6px;padding-top:8px}
.pop-search{height:26px;font-size:12px;margin-bottom:6px}
.menu-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:2px;font-size:12px;color:var(--t2);cursor:pointer;white-space:nowrap}
.menu-item:hover{background:#f5f8ff;color:var(--brand)}
.menu-item.danger{color:var(--danger)}
.menu-item.danger:hover{background:var(--danger-bg);color:var(--danger)}
.menu-item .k{margin-left:auto;color:#a9afb8;font-size:11px}

.toast-host{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{
  pointer-events:auto;display:flex;align-items:center;gap:8px;min-width:200px;max-width:420px;
  background:#fff;border:1px solid var(--bd);border-left:3px solid var(--ok);border-radius:var(--r);
  box-shadow:0 6px 20px rgba(0,0,0,.12);padding:9px 12px;font-size:12px;color:var(--t1);
  animation:slideLeft .18s ease;
}
.toast.err{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warn)}
.toast.info{border-left-color:var(--brand)}
.toast .ico{flex:0 0 16px;display:flex}
.toast .msg{flex:1 1 auto;line-height:1.45}
.toast .act-t{color:var(--brand);font-weight:600;cursor:pointer;white-space:nowrap;margin-left:6px}
.toast .act-t:hover{text-decoration:underline}
.toast.out{opacity:0;transform:translateX(12px);transition:opacity .2s,transform .2s}

/* ---------- 17. P1 流程图页 ---------- */
.p1-subtabs{display:flex;align-items:center;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.p1-subtab{
  height:32px;padding:0 16px;border:1px solid var(--bd-3);background:#fff;border-radius:var(--r);
  font-size:13px;color:var(--t2);display:flex;align-items:center;gap:6px;
}
.p1-subtab:hover{color:var(--brand);border-color:var(--brand)}
.p1-subtab.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
.stage-wrap{display:flex;gap:12px;align-items:stretch}
.stage{
  flex:1 1 auto;min-width:0;background:#fafbfc;border:1px solid var(--bd);
  border-radius:var(--r);min-height:420px;display:flex;align-items:center;justify-content:center;
  padding:14px;overflow:hidden;position:relative;
}
.stage.fit .stage-img{max-width:100%;max-height:620px}
.stage.actual{overflow:auto;align-items:flex-start;justify-content:flex-start}
.stage.actual .stage-img{max-width:none}
.stage-img{border:0;border-radius:2px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.08);cursor:zoom-in}
.stage-hint{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--t3);background:rgba(255,255,255,.9);padding:2px 6px;border-radius:2px}
.ph-card{
  width:100%;min-height:380px;border:1px dashed #b9c6dd;border-radius:var(--r);background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px;text-align:center;
}
.ph-card .ph-ico{width:64px;height:64px;border-radius:50%;background:#eef2f8;display:flex;align-items:center;justify-content:center;color:#9fb3d1}
.ph-card b{font-size:15px;color:var(--t1)}
.ph-card p{font-size:12px;color:var(--t3);line-height:1.7;max-width:460px}
.ph-card code{background:#f2f3f5;border:1px solid var(--bd);border-radius:2px;padding:1px 5px;font-size:11px;color:#4e5969}
.stage-tools{display:flex;flex-direction:column;gap:8px;flex:0 0 auto;width:150px}
.stage-tools .btn{width:100%;justify-content:flex-start}
.legend-box{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;margin-top:12px}
.legend-box h4{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.legend-box h4::before{content:"";width:3px;height:13px;background:var(--brand);border-radius:1px}
.legend-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px 18px;font-size:12px;color:var(--t2)}
.legend-list li{display:flex;gap:7px;align-items:flex-start;line-height:1.6}
.legend-sw{width:9px;height:9px;border-radius:2px;flex:0 0 9px;margin-top:5px;background:var(--brand)}
.lightbox{position:fixed;inset:0;z-index:300;background:rgba(12,18,28,.88);display:flex;flex-direction:column;animation:fade .15s ease}
.lb-bar{height:48px;flex:0 0 48px;display:flex;align-items:center;gap:8px;padding:0 14px;color:#e6ecf7;background:rgba(0,0,0,.25);font-size:12px}
.lb-bar b{font-size:13px;font-weight:600;margin-right:auto}
.lb-btn{height:28px;padding:0 10px;border:1px solid rgba(255,255,255,.28);border-radius:2px;color:#e6ecf7;font-size:12px;display:flex;align-items:center;gap:5px}
.lb-btn:hover{background:rgba(255,255,255,.14);color:#fff}
.lb-x{margin-left:4px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#cfd8e8;border-radius:2px}
.lb-x:hover{background:rgba(255,255,255,.16);color:#fff}
.lb-stage{flex:1 1 auto;min-height:0;overflow:hidden;cursor:grab;display:flex;align-items:center;justify-content:center;position:relative}
.lb-stage.grabbing{cursor:grabbing}
.lb-stage img{max-width:none;transform-origin:center center;user-select:none;-webkit-user-drag:none;background:#fff;border-radius:2px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.lb-zoom{position:absolute;right:14px;bottom:14px;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.4);border-radius:2px;padding:5px 8px;color:#e6ecf7;font-size:12px}
.lb-zoom button{width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:#e6ecf7;border:1px solid rgba(255,255,255,.25);border-radius:2px}
.lb-zoom button:hover{background:rgba(255,255,255,.2)}
.lb-ph{padding:24px;border:1px dashed rgba(255,255,255,.4);border-radius:6px;color:#c9d6ee;font-size:13px;text-align:center;line-height:1.9}

/* ---------- 18. P2 报表中心 ---------- */
.p2-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.p2-search{position:relative;flex:1 1 280px;max-width:420px}
.p2-search .inp{height:32px;padding-left:30px}
.p2-search .s-ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#a9afb8}
.p2-cats{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:14px;overflow-x:auto}
.p2-cat{height:36px;padding:0 14px;font-size:13px;color:var(--t2);position:relative;white-space:nowrap;flex:0 0 auto}
.p2-cat:hover{color:var(--brand)}
.p2-cat.on{color:var(--brand);font-weight:600}
.p2-cat.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--brand)}
.p2-cat .cnt{color:var(--t3);font-size:11px;margin-left:4px;font-weight:400}
.p2-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.rcard{
  background:#fff;border:1px solid var(--bd);border-radius:var(--r-card);box-shadow:var(--shadow);
  padding:14px 16px;display:flex;flex-direction:column;gap:8px;position:relative;transition:border-color .15s,box-shadow .15s;
}
.rcard:hover{border-color:#b9c9e6;box-shadow:0 4px 14px rgba(6,39,103,.1)}
.rcard-hd{display:flex;align-items:flex-start;gap:8px}
.rcard-no{
  width:26px;height:26px;flex:0 0 26px;border-radius:2px;background:#eef2f8;color:var(--brand);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
}
.rcard-t{font-size:14px;font-weight:600;color:var(--t1);line-height:1.4;padding-top:3px}
.star{margin-left:auto;width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:#c9cdd4;border-radius:2px;flex:0 0 24px}
.star:hover{background:#fffbe6;color:var(--warn)}
.star.on{color:var(--warn)}
.rcard-b{font-size:12px;color:var(--t2);line-height:1.7;min-height:42px}
.rcard-tags{display:flex;flex-wrap:wrap;gap:5px}
.rcard-tag{font-size:11px;color:var(--t2);background:#f5f7fa;border:1px solid #eef0f4;border-radius:2px;padding:1px 6px}
.rcard-ft{display:flex;align-items:center;gap:8px;margin-top:2px;padding-top:8px;border-top:1px dashed var(--bd-2)}
.rcard-cat{font-size:11px;color:var(--t3)}
.rcard-ft .btn{margin-left:auto}

/* ---------- 19. P15 质量检验方案 ---------- */
.p15{display:flex;flex-direction:column;gap:12px}
.p15-filter{padding:16px 20px}
.p15-toolbar{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:10px 16px;border-bottom:1px solid var(--bd-2);flex-wrap:wrap}
.p15-toolbar-l{margin-right:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--t3)}
.p15-table-card{padding:0}
.p15-hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.p15-hd h2{font-size:16px;font-weight:600}
.p15-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:70px 20px;text-align:center}
.p15-empty .ill{width:110px;height:80px;opacity:.9}
.p15-empty b{font-size:15px;color:var(--t1)}
.p15-empty p{font-size:12px;color:var(--t3)}
.sel-bar{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--sel);border-bottom:1px solid #dbe7ff;font-size:12px;color:var(--brand-3);flex-wrap:wrap}
.sel-bar b{color:var(--brand)}
.sel-bar .clear{color:var(--link);cursor:pointer}
.sel-bar .clear:hover{text-decoration:underline}

/* ---------- 20. 打印 ---------- */
@media print{
  body{overflow:visible;background:#fff}
  .ptabs,.topbar,.sidebar,.biztabs,.toast-host,.layer-mask,.layer-drawer,.popover,.pager,.card-hd-r,.page-hd-r,.table-tools,.f-tools,.tbl-scroll{display:none!important}
  .app,.shell,.main,.view{display:block!important;overflow:visible!important;height:auto!important;padding:0!important}
  .card{box-shadow:none;border-color:#ddd;break-inside:avoid}
  .tbl-wrap{overflow:visible}
}

/* ---------- 21. 自适应 ---------- */
@media (max-width:1440px){
  .filters-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px;padding-right:236px}
  .f-label{width:82px;flex-basis:82px;font-size:12px}
  .f-ctl .combo-op{width:82px;flex-basis:82px}
  .chart-grid.two{grid-template-columns:1fr}
}
@media (max-width:1280px){
  .topbar-title{font-size:17px;letter-spacing:1px}

<script>/* core.js */
﻿/* ============================================================
   core.js —— 通用组件库（从已验证的质量报表原型抽取，供全系统原型复用）
   暴露：window.MOMCore.*
   提供：$ / $$ / el / svg / Toast / Layers(弹层·抽屉·气泡·确认) / Chart /
        createTable（排序·列筛选·分页·勾选·列设置）/ 图标 / 格式化工具
   ============================================================ */
(function () {
  'use strict';

  var NS = 'http://www.w3.org/2000/svg';

  /* ============================================================
     0. 工具
     ============================================================ */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function el(tag, attrs, kids) {
    var node = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (!Object.prototype.hasOwnProperty.call(attrs, k)) { continue; }
        var v = attrs[k];
        if (v === null || v === undefined || v === false) { continue; }
        if (k === 'class' || k === 'className') { node.className = v; }
        else if (k === 'text') { node.textContent = String(v); }
        else if (k === 'html') { node.innerHTML = v; }
        else if (k === 'style' && typeof v === 'object') {
          for (var s in v) { if (Object.prototype.hasOwnProperty.call(v, s)) { node.style[s] = v[s]; } }
        } else if (k === 'dataset' && typeof v === 'object') {
          for (var d in v) { if (Object.prototype.hasOwnProperty.call(v, d)) { node.setAttribute('data-' + d, v[d]); } }
        } else if (k.slice(0, 2) === 'on' && typeof v === 'function') {
          node.addEventListener(k.slice(2).toLowerCase(), v);
        } else {
          node.setAttribute(k, v === true ? '' : String(v));
        }
      }
    }
    appendKids(node, kids);
    return node;
  }

  function appendKids(node, kids) {
    if (kids === null || kids === undefined || kids === false) { return; }
    if (Array.isArray(kids)) {
      for (var i = 0; i < kids.length; i++) { appendKids(node, kids[i]); }
    } else if (kids instanceof Node) {
      node.appendChild(kids);
    } else {
      node.appendChild(document.createTextNode(String(kids)));
    }
  }

  function svg(tag, attrs) {
    var n = document.createElementNS(NS, tag);
    if (attrs) {
      for (var k in attrs) {
        if (!Object.prototype.hasOwnProperty.call(attrs, k)) { continue; }
        var v = attrs[k];
        if (v === null || v === undefined || v === false) { continue; }
        n.setAttribute(k, String(v));
      }
    }
    return n;
  }

  function clear(node) { while (node && node.firstChild) { node.removeChild(node.firstChild); } }
  function text(s) { return document.createTextNode(s === null || s === undefined ? '' : String(s)); }
  function cls(node, name, on) { if (!node) { return; } if (on) { node.classList.add(name); } else { node.classList.remove(name); } }

  function debounce(fn, ms) {
    var t = null;
    return function () {
      var self = this, args = arguments;
      if (t) { clearTimeout(t); }
      t = setTimeout(function () { t = null; fn.apply(self, args); }, ms);
    };
  }

  function fmtNum(v) {
    if (v === null || v === undefined || v === '') { return ''; }
    var n = Number(v);
    if (!isFinite(n)) { return String(v); }
    var s = Math.abs(n) >= 1000 ? n.toLocaleString('zh-CN') : String(n);
    return s;
  }
  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function nowStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function csvCell(v) {
    var s = v === null || v === undefined ? '' : String(v);
    if (/[",\r\n]/.test(s)) { return '"' + s.replace(/"/g, '""') + '"'; }
    return s;
  }
  function toCSV(headers, rows) {
    var out = [];
    out.push(headers.map(csvCell).join(','));
    rows.forEach(function (r) { out.push(r.map(csvCell).join(',')); });
    return '\uFEFF' + out.join('\r\n');
  }
  function download(filename, content, mime) {
    try {
      var blob = new Blob([content], { type: (mime || 'text/csv') + ';charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = el('a', { href: url, download: filename, style: { display: 'none' } });
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        if (a.parentNode) { a.parentNode.removeChild(a); }
        URL.revokeObjectURL(url);
      }, 400);
      return true;
    } catch (e) {
      Toast.show('当前浏览器不支持直接下载，已复制到剪贴板', 'warn');
      return false;
    }
  }

  function storeGet(key) {
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  }
  function storeSet(key, val) {
    try { window.localStorage.setItem(key, val); } catch (e) { /* file:// 下可能不可用，忽略 */ }
  }

  /* 安全执行事件回调：避免个别异常打断整个交互 */
  function guard(fn) {
    return function (ev) {
      try { return fn.call(this, ev); }
      catch (err) {
        if (window.console && console.warn) { console.warn('[mes-proto] 交互异常：', err && err.message ? err.message : err); }
        Toast.show('操作未完成，请重试', 'err');
      }
    };
  }

  /* ============================================================
     1. Toast（右上角堆叠，2.4s 消失）
     ============================================================ */
  var Toast = (function () {
    var host = null;
    function ensure() {
      host = $('#toastHost');
      if (!host) { host = el('div', { class: 'toast-host', id: 'toastHost', role: 'status', 'aria-live': 'polite' }); document.body.appendChild(host); }
      return host;
    }
    var ICONS = {
      ok: '<svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="10" fill="#52c41a"/><path d="m7.6 12.4 3 3 5.8-6.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>',
      err: '<svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="10" fill="#e0263b"/><path d="M8 8l8 8M16 8l-8 8" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>',
      warn: '<svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="10" fill="#faad14"/><path d="M12 7v6" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16.4" r="1.2" fill="#fff"/></svg>',
      info: '<svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="10" fill="#1664ff"/><path d="M12 11v6" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.2" fill="#fff"/></svg>'
    };
    function show(msg, type, action) {
      var h = ensure();
      type = type || 'ok';
      var t = el('div', { class: 'toast ' + (type === 'ok' ? '' : type), role: 'alert' });
      var ico = el('span', { class: 'ico', html: ICONS[type] || ICONS.ok, 'aria-hidden': 'true' });
      var m = el('span', { class: 'msg', text: msg });
      t.appendChild(ico); t.appendChild(m);
      var timer = null;
      function close() {
        if (!t.parentNode) { return; }
        t.classList.add('out');
        setTimeout(function () { if (t.parentNode) { t.parentNode.removeChild(t); } }, 220);
        if (timer) { clearTimeout(timer); }
      }
      if (action && action.label) {
        var a = el('span', { class: 'act-t', text: action.label, role: 'button', tabindex: '0' });
        a.addEventListener('click', guard(function () { close(); action.onClick && action.onClick(); }));
        a.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); a.click(); } });
        t.appendChild(a);
      }
      h.appendChild(t);
      /* 最多同时 4 条 */
      while (h.children.length > 4) { h.removeChild(h.firstChild); }
      timer = setTimeout(close, 2400);
      t.addEventListener('mouseenter', function () { if (timer) { clearTimeout(timer); } });
      t.addEventListener('mouseleave', function () { timer = setTimeout(close, 1200); });
      return { close: close };
    }
    return { show: show };
  })();

  /* ============================================================
     2. 弹层：modal / drawer / popover / confirm
     ============================================================ */
  var Layers = (function () {
    var stack = [];
    function push(layer) {
      stack.push(layer);
      document.addEventListener('keydown', onKey, true);
    }
    function pop(layer) {
      var i = stack.indexOf(layer);
      if (i >= 0) { stack.splice(i, 1); }
      if (!stack.length) { document.removeEventListener('keydown', onKey, true); }
    }
    function onKey(e) {

        }
        if (control.lcl !== null && control.lcl !== undefined && isFinite(Number(control.lcl))) {
          var c3 = el('span', {});
          c3.appendChild(el('i', { style: { background: '#e0263b' } }));

    function barChart(host, spec) {
      var w = measure(host), h = spec.height || 240;

      var innerW = w - pad.l - pad.r, innerH = h - pad.t - pad.b;

      }

      if (max === lo) { max = lo + 1; }

      var ticks = ticksFor(lo, hi, 4);

      root.appendChild(axisFrame(w, h, pad));

            });

    function lineChart(host, spec) {
      var w = measure(host), h = spec.height || 240;
      var pad = { l: 54, r: 62, t: 18, b: 34 };

            x1: pad.l, y1: y, x2: w - pad.r, y2: y, stroke: c[2], 'stroke-width': 1.4,

          }));
          var lab = svg('text', { x: w - pad.r + 2, y: y + 3.5, 'font-size': 10, fill: c[2], 'text-anchor': 'start' });

        });
      }
      series.forEach(function (s, si) {
        var color = s.color || PALETTE[si % PALETTE.length];
        var dash = /目标|上限|下限/.test(s.name) ? '6 4' : '0';
        var pts = s.values.map(function (v, i) {
          return (pad.l + step * i) + ',' + scaleY(Number(v), lo, hi, innerH, pad.t);
        }).join(' ');
        root.appendChild(svg('polyline', {
          points: pts, fill: 'none', stroke: color, 'stroke-width': 2,
          'stroke-linejoin': 'round', 'stroke-dasharray': dash

        s.values.forEach(function (v, i) {
          var x = pad.l + step * i;
          var y = scaleY(Number(v), lo, hi, innerH, pad.t);
          var out = control && (Number(v) > control.ucl || Number(v) < control.lcl);
          var dot = svg('circle', {
            cx: x, cy: y, r: out ? 4 : 3,
            fill: out ? '#e0263b' : '#fff', stroke: out ? '#e0263b' : color, 'stroke-width': 2
          });
          var tt = svg('title', {});
          tt.textContent = labels[i] + ' ' + s.name + '：' + v + (spec.unit || '');
          dot.appendChild(tt);
          root.appendChild(dot);
        });
      });
      host.appendChild(root);
    }

    function pieChart(host, spec) {
      var w = measure(host), h = spec.height || 240;
      var data = spec.pie || [];
      var total = data.reduce(function (a, b) { return a + Number(b.value); }, 0) || 1;
      var r = Math.min(h - 36, 104), cx = Math.max(120, Math.floor(w * 0.3)), cy = h / 2;

        var end = start + ang;
        var x1 = cx + Math.cos(start) * r, y1 = cy + Math.sin(start) * r;
        var x2 = cx + Math.cos(end) * r, y2 = cy + Math.sin(end) * r;

          d: 'M' + cx + ',' + cy + ' L' + x1 + ',' + y1 + ' A' + r + ',' + r + ' 0 ' + large + ' 1 ' + x2 + ',' + y2 + ' Z',
          fill: d.color || PALETTE[i % PALETTE.length], stroke: '#fff', 'stroke-width': 1.5
        });
        var tt = svg('title', {});
        tt.textContent = d.name + '：' + d.value + '（' + ((Number(d.value) / total) * 100).toFixed(1) + '%）';
        path.appendChild(tt);
        root.appendChild(path);
        start = end;
      });
      root.appendChild(svg('circle', { cx: cx, cy: cy, r: r * 0.46, fill: '#fff' }));
      var tv = svg('text', { x: cx, y: cy - 2, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 700, fill: '#1d2129' });
      tv.textContent = fmtNum(total);
      root.appendChild(tv);
      var tl = svg('text', { x: cx, y: cy + 16, 'text-anchor': 'middle', 'font-size': 11, fill: '#86909c' });
      tl.textContent = spec.totalLabel || '合计';

      var lx = Math.max(cx + r + 30, w * 0.56), ly = Math.max(24, cy - data.length * 11);

        var t1 = svg('text', { x: lx + 15, y: y, 'font-size': 11, fill: '#4e5969' });
        t1.textContent = d.name;
        root.appendChild(t1);
        var t2 = svg('text', { x: w - 14, y: y, 'font-size': 11, fill: '#1d2129', 'text-anchor': 'end', 'font-weight': 600 });
        t2.textContent = fmtNum(d.value) + ' · ' + ((Number(d.value) / total) * 100).toFixed(1) + '%';
        root.appendChild(t2);
      });
      host.appendChild(root);
    }

    function histChart(host, spec) {
      var w = measure(host), h = spec.height || 240;
      var pad = { l: 46, r: 18, t: 18, b: 34 };
      var innerW = w - pad.l - pad.r, innerH = h - pad.t - pad.b;

      counts.forEach(function (c, i) {
        var y = scaleY(c, 0, hi, innerH, pad.t);

        });
        var tt = svg('title', {});

        }));

          x: x + (x > w - pad.r - 70 ? -4 : 3), y: pad.t + 10,

        });
        t.textContent = s[1] + ' ' + s[0];
        root.appendChild(t);
      });
      bins.forEach(function (b, i) {

        var t = svg('text', {
          x: pad.l + step * i + step / 2, y: h - pad.b + 16, 'text-anchor': 'middle', 'font-size': 10, fill: '#4e5969'
        });
        t.textContent = b;
        root.appendChild(t);
      });
      host.appendChild(root);
    }

    function render(host, spec, legendEl) {
      if (!host || !spec) { return; }

  /* ============================================================
     5. 表格组件（排序 / 列筛选 / 分页 / 勾选 / 列设置 / 骨架屏）
     ============================================================ */
  function createTable(host, cfg) {
    cfg = cfg || {};
    var columns = (cfg.columns || []).slice();
    var state = {
      page: 1,
      size: cfg.pageSize || 10,
      sizes: cfg.pageSizes || [10, 20, 50],
      sortKey: null,
      sortDir: 0,
      filters: {},
      sel: (function () {
        var s = {};
        (cfg.initialSelected || []).forEach(function (k) { s[k] = true; });
        return s;
      })(),
      data: (cfg.rows || []).slice(),
      loading: !!cfg.loading,
      hidden: {},
      selTouched: false,
      total: cfg.total || null
    };
    var wrap, table, colgroup, thead, tbody, pager, selBar;

    function keyOf(row) { return cfg.rowKey ? cfg.rowKey(row) : (row && row.__id !== undefined ? row.__id : String(row)); }
    function visibleCols() { return columns.filter(function (c) { return !state.hidden[c.key]; }); }
    function cellText(row, c) {
      var v = row[c.key];
      if (v === null || v === undefined) { return ''; }
      return String(v);
    }
    function cmp(a, b) {
      var c = columns.filter(function (x) { return x.key === state.sortKey; })[0];
      var t = c ? c.type : 'text';
      var va = a[state.sortKey], vb = b[state.sortKey];
      if (t === 'num' || t === 'pct' || t === 'delta') {
        var na = parseFloat(va), nb = parseFloat(vb);
        if (!isFinite(na)) { na = -Infinity; }
        if (!isFinite(nb)) { nb = -Infinity; }
        return (na - nb) * state.sortDir;
      }
      return String(va === undefined || va === null ? '' : va)
        .localeCompare(String(vb === undefined || vb === null ? '' : vb), 'zh-CN') * state.sortDir;
    }
    function filtered() {
      var keys = Object.keys(state.filters);
      var rows = state.data.filter(function (r) {
        for (var i = 0; i < keys.length; i++) {
          var k = keys[i], vals = state.filters[k];
          if (!vals || !vals.length) { continue; }
          var v = r[k] === null || r[k] === undefined ? '' : String(r[k]);
          var hit = vals.some(function (x) { return String(x) === v; });
          if (!hit && vals.indexOf('__EMPTY__') >= 0 && v === '') { hit = true; }
          if (!hit) { return false; }
        }
        return true;
      });
      if (state.sortKey && state.sortDir) { rows = rows.slice().sort(cmp); }
      return rows;
    }
    function pageCount(rows) { return Math.max(1, Math.ceil(rows.length / state.size)); }

    /* ---------- 表头 ---------- */
    function renderHead() {
      clear(thead);
      clear(colgroup);
      var cols = visibleCols();
      var tr = el('tr', {});
      if (cfg.selectable) {
        var thc = el('th', { class: 'chk-cell', scope: 'col' });
        var box = el('input', { type: 'checkbox', 'aria-label': '全选当前页' });
        box.checked = pageRowsAllSelected();
        box.addEventListener('change', guard(function () {
          state.selTouched = true;

          if (box.checked) { rows.forEach(function (r) { state.sel[keyOf(r)] = true; }); }
          else { rows.forEach(function (r) { delete state.sel[keyOf(r)]; }); }

        }));
        thc.appendChild(box);
        tr.appendChild(thc);
        colgroup.appendChild(el('col', { style: { width: '44px' } }));
      }
      cols.forEach(function (c) {
        var th = el('th', { scope: 'col', class: (c.sort ? 'sortable ' : '') + (state.sortKey === c.key ? (state.sortDir > 0 ? 'sort-asc' : 'sort-desc') : '') });
        var inner = el('div', { class: 'th-in' });
        inner.appendChild(el('span', { class: 'th-txt', title: c.title, text: c.title }));
        if (c.filter) {
          var f = el('button', {
            class: 'th-cbtn' + (state.filters[c.key] && state.filters[c.key].length ? ' on' : ''),
            type: 'button', 'aria-label': '筛选『' + c.title + '』', title: '筛选'
          }, null);
          f.innerHTML = iconHTML('filter', 12);

            if (state.sortKey !== c.key) { state.sortKey = c.key; state.sortDir = 1; }

          }));
        }
        th.appendChild(inner);
        tr.appendChild(th);
        colgroup.appendChild(el('col', { style: { width: (c.w || 120) + 'px' } }));
      });
      if (cfg.opRender || cfg.opTitle) {
        var tho = el('th', { class: 'col-op', scope: 'col' });
        var ino = el('div', { class: 'th-in' });
        ino.appendChild(el('span', { class: 'th-txt', text: cfg.opTitle || '操作' }));
        if (cfg.onColSettings) {
          var g = el('button', { class: 'th-cbtn gear', type: 'button', 'aria-label': '列设置', title: '列设置' }, null);
          g.innerHTML = iconHTML('gear', 13);
          g.addEventListener('click', guard(function (e) { e.stopPropagation(); cfg.onColSettings(g); }));
          ino.appendChild(g);
        }
        tho.appendChild(ino);
        tr.appendChild(tho);
        colgroup.appendChild(el('col', { style: { width: (cfg.opWidth || 170) + 'px' } }));
      }
      table.appendChild(colgroup);
      thead.appendChild(tr);
    }

    /* ---------- 单元格 ---------- */
    function cellNode(row, c) {
      var v = row[c.key];
      var td = el('td', { class: 'col-' + c.key });
      if (c.type === 'switch') {
        var swWrap = el('label', { class: 'cell-switch' });
        var swInp = el('input', { type: 'checkbox' });
        swInp.checked = !/^(停用|无效|false|0|否)$/.test(String(v));
        swInp.disabled = true;
        swWrap.appendChild(swInp);
        swWrap.appendChild(el('span', { class: 'cell-switch-track' }));
        td.appendChild(swWrap);
        td.classList.add('col-center');
      } else if (c.type === 'status') {
        td.appendChild(el('span', { class: 'tag ' + tagFor(String(v), c.tag), text: v }));
      } else if (c.type === 'tag') {
        td.appendChild(el('span', { class: 'tag ' + (c.tag || tagFor(String(v))), text: v }));
      } else if (c.type === 'delta') {
        td.appendChild(deltaNode(v, c.invert));
      } else if (c.type === 'num') {
        td.appendChild(el('span', { class: 'cell-ellip', title: fmtNum(v), text: fmtNum(v) }));
      } else if (c.type === 'pct') {
        var n = Number(v);
        td.appendChild(el('span', { class: 'cell-ellip', title: n + '%', text: isFinite(n) ? n.toFixed(2) + '%' : String(v) }));
      } else {
        td.appendChild(el('span', { class: 'cell-ellip', title: v === null || v === undefined ? '' : String(v), text: v }));
      }
      return td;
    }

    function currentPageRows() {
      var rows = filtered();
      var pages = pageCount(rows);
      if (state.page > pages) { state.page = pages; }
      var start = (state.page - 1) * state.size;
      return rows.slice(start, start + state.size);
    }
    function pageRowsAllSelected() {
      var rows = currentPageRows();
      if (!rows.length) { return false; }
      return rows.every(function (r) { return !!state.sel[keyOf(r)]; });
    }

    /* ---------- 表体 ---------- */
    function renderBody() {
      clear(tbody);
      var cols = visibleCols();
      var span = cols.length + (cfg.selectable ? 1 : 0) + (cfg.opRender ? 1 : 0);
      if (state.loading) {
        for (var i = 0; i < Math.min(state.size, 10); i++) {
          var trS = el('tr', { class: 'sk-tr' });
          for (var j = 0; j < span; j++) {
            var tdS = el('td', {});
            tdS.appendChild(el('div', {
              class: 'sk',
              style: { width: (j === 0 ? 16 : 40 + ((i * 7 + j * 13) % 55)) + '%', height: '10px' }
            }));
            trS.appendChild(tdS);
          }
          tbody.appendChild(trS);
        }
        return;
      }
      var rows = currentPageRows();
      if (!rows.length) {
        var trE = el('tr', { class: 'tbl-empty' });
        var tdE = el('td', { colspan: span });
        tdE.appendChild(emptyState({
          title: cfg.emptyTitle || '暂无数据',
          desc: cfg.emptyDesc || '调整筛选条件或点击「重置」后再查询',
          action: cfg.onEmptyAction || null
        }));
        trE.appendChild(tdE);
        tbody.appendChild(trE);
        return;
      }
      rows.forEach(function (row) {
        var id = keyOf(row);
        var tr = el('tr', { class: state.sel[id] ? 'sel' : '' });
        if (cfg.selectable) {
          var tdc = el('td', { class: 'chk-cell' });
          var cb = el('input', { type: 'checkbox', 'aria-label': '选择该行' });
          cb.checked = !!state.sel[id];
          cb.addEventListener('change', guard(function () {
            state.selTouched = true;
            if (cb.checked) { state.sel[id] = true; } else { delete state.sel[id]; }
            cls(tr, 'sel', cb.checked);
            renderHead(); updateSelBar();
          }));
          tdc.appendChild(cb);
          tr.appendChild(tdc);
        }
        cols.forEach(function (c) { tr.appendChild(cellNode(row, c)); });
        if (cfg.opRender) {
          var tdo = el('td', { class: 'col-op' });
          var n = cfg.opRender(row, api);
          if (n instanceof Node) { tdo.appendChild(n); } else { tdo.innerHTML = n || ''; }
          tr.appendChild(tdo);
        }
        if (cfg.selectable) {
          tr.addEventListener('click', guard(function (e) {
            if (e.target && e.target.closest && e.target.closest('input,button,a')) { return; }
            state.selTouched = true;
            var multi = e.ctrlKey || e.metaKey;
            if (multi) {
              if (state.sel[id]) { delete state.sel[id]; } else { state.sel[id] = true; }
            } else {
              var was = !!state.sel[id];
              state.sel = {};
              if (!was) { state.sel[id] = true; }
            }
            renderBody(); renderHead(); updateSelBar();
          }));
        }
        if (cfg.onRowDoubleClick) {
          tr.addEventListener('dblclick', guard(function () { cfg.onRowDoubleClick(row); }));
        }
        tbody.appendChild(tr);
      });
    }

    /* ---------- 列筛选弹层 ---------- */
    function openFilter(c, anchor) {
      var all = state.data.map(function (r) {
        var v = r[c.key];
        return v === null || v === undefined || v === '' ? '__EMPTY__' : String(v);
      });
      var uniq = [];
      all.forEach(function (v) { if (uniq.indexOf(v) < 0) { uniq.push(v); } });
      uniq.sort(function (a, b) { return a.localeCompare(b, 'zh-CN'); });
      var chosen = (state.filters[c.key] || []).slice();

      var box = el('div', {});
      box.appendChild(el('div', { class: 'pop-hd', text: '筛选：' + c.title }));
      var search = el('input', { class: 'inp pop-search', type: 'text', placeholder: '搜索值…', 'aria-label': '搜索筛选值' });
      box.appendChild(search);
      var list = el('div', { class: 'pop-list' });
      box.appendChild(list);
      var items = [];
      function paint(kw) {
        clear(list);
        items = [];
        uniq.forEach(function (v) {
          var label = v === '__EMPTY__' ? '(空值)' : v;
          if (kw && label.toLowerCase().indexOf(kw.toLowerCase()) < 0) { return; }
          var rowEl = el('label', { class: 'pop-item' + (chosen.indexOf(v) >= 0 ? ' on' : '') });
          var cb = el('input', { type: 'checkbox' });
          cb.checked = chosen.indexOf(v) >= 0;
          cb.addEventListener('change', function () {
            var i = chosen.indexOf(v);
            if (cb.checked && i < 0) { chosen.push(v); }
            if (!cb.checked && i >= 0) { chosen.splice(i, 1); }
            cls(rowEl, 'on', cb.checked);
          });
          rowEl.appendChild(cb);
          rowEl.appendChild(el('span', { text: label }));
          list.appendChild(rowEl);
          items.push(v);
        });
        if (!items.length) { list.appendChild(el('div', { class: 'pop-item', text: '无匹配值' })); }
      }
      paint('');
      search.addEventListener('input', debounce(function () { paint(search.value.trim()); }, 120));
      var ft = el('div', { class: 'pop-ft' });
      var clearBtn = el('button', { class: 'btn btn-text btn-sm', type: 'button', text: '清空' });
      var okBtn = el('button', { class: 'btn btn-primary btn-sm', type: 'button', text: '确定' });
      ft.appendChild(clearBtn); ft.appendChild(okBtn);
      box.appendChild(ft);
      var pop = Layers.popover(anchor, box, { width: 232, align: 'right' });
      clearBtn.addEventListener('click', guard(function () {
        delete state.filters[c.key]; state.page = 1; pop.close(); render();
      }));
      okBtn.addEventListener('click', guard(function () {
        if (chosen.length) { state.filters[c.key] = chosen.slice(); } else { delete state.filters[c.key]; }
        state.page = 1; pop.close(); render();
      }));
    }

    /* ---------- 分页 ---------- */
    function renderPager() {
      clear(pager);
      var rows = filtered();
      var pages = pageCount(rows);
      var total = state.total !== null ? state.total : rows.length;
      pager.appendChild(el('span', { class: 'pg-total', html: '共计 <b>' + String(total) + '</b> 条' }));
      var list = el('div', { class: 'pg-list' });
      function pgBtn(label, page, opts) {
        opts = opts || {};
        var b = el('button', {
          class: 'pg-btn' + (opts.on ? ' on' : ''), type: 'button',
          'aria-label': opts.aria || label, 'aria-current': opts.on ? 'page' : null
        }, null);
        if (opts.html) { b.innerHTML = opts.html; } else { b.textContent = label; }
        if (opts.disabled) { b.disabled = true; }
        else { b.addEventListener('click', guard(function () { state.page = page; renderBody(); renderPager(); })); }
        return b;
      }
      list.appendChild(pgBtn('', state.page - 1, { disabled: state.page <= 1, html: '‹', aria: '上一页' }));
      var nums = [];
      if (pages <= 7) { for (var i = 1; i <= pages; i++) { nums.push(i); } }
      else {
        nums.push(1);
        if (state.page > 3) { nums.push('…'); }
        var winStart = Math.max(2, state.page - 1);
        var winEnd = Math.min(pages - 1, state.page + 1);
        if (state.page <= 2) { winStart = 2; winEnd = 1; }
        if (state.page >= pages - 1) { winStart = pages; winEnd = pages - 1; }
        for (var p = winStart; p <= winEnd; p++) { nums.push(p); }
        if (state.page < pages - 2) { nums.push('…'); }
        nums.push(pages);
      }
      nums.forEach(function (n) {
        if (n === '…') { list.appendChild(el('span', { class: 'pg-dots', text: '···' })); return; }
        list.appendChild(pgBtn(String(n), n, { on: n === state.page }));
      });
      list.appendChild(pgBtn('', state.page + 1, { disabled: state.page >= pages, html: '›', aria: '下一页' }));
      pager.appendChild(list);

      var sizeWrap = el('div', { class: 'pg-size' });
      var sel = el('select', { class: 'sel', 'aria-label': '每页条数' });
      state.sizes.forEach(function (s) {
        var o = el('option', { value: s, text: s + ' 条/页' });
        if (s === state.size) { o.selected = true; }
        sel.appendChild(o);
      });
      sel.addEventListener('change', guard(function () {
        state.size = parseInt(sel.value, 10) || 10; state.page = 1; render();
      }));
      sizeWrap.appendChild(sel);
      pager.appendChild(sizeWrap);

      var jump = el('div', { class: 'pg-jump' });
      jump.appendChild(el('span', { text: '跳至' }));
      var inp = el('input', { class: 'inp', type: 'text', inputmode: 'numeric', 'aria-label': '跳转页码', value: String(state.page) });
      function doJump() {
        var n = parseInt(inp.value, 10);
        if (!isFinite(n)) { n = 1; }
        state.page = Math.max(1, Math.min(pages, n));
        inp.value = String(state.page);
        renderBody(); renderPager();
      }
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { doJump(); } });
      inp.addEventListener('blur', doJump);
      jump.appendChild(inp);
      jump.appendChild(el('span', { text: '页' }));
      pager.appendChild(jump);
    }

    /* ---------- 选中提示条 ---------- */
    function updateSelBar() {
      if (!selBar) { return; }
      var n = Object.keys(state.sel).length;
      if (!n || !state.selTouched) { selBar.style.display = 'none'; return; }
      selBar.style.display = 'flex';
      clear(selBar);
      selBar.appendChild(el('span', { html: '已选择 <b>' + n + '</b> 项' }));
      var clr = el('span', { class: 'clear', role: 'button', tabindex: '0', text: '清空选择' });
      clr.addEventListener('click', guard(function () { state.sel = {}; render(); }));
      selBar.appendChild(clr);
      if (cfg.onSelBarRender && cfg.onSelBarRender(selBar) === false) { return; }
    }

    /* ---------- 装配 ---------- */
    clear(host);
    if (cfg.selectable) {
      selBar = el('div', { class: 'sel-bar', style: { display: 'none' } });
      host.appendChild(selBar);
    }
    wrap = el('div', { class: 'tbl-wrap' + (cfg.maxHeight ? ' scroll-y' : ''), style: cfg.maxHeight ? { maxHeight: cfg.maxHeight + 'px' } : null });
    table = el('table', { class: 'tbl', role: 'table' });
    colgroup = el('colgroup', {});
    thead = el('thead', {});
    tbody = el('tbody', {});
    table.appendChild(colgroup); table.appendChild(thead); table.appendChild(tbody);
    wrap.appendChild(table);
    host.appendChild(wrap);
    pager = el('div', { class: 'pager', role: 'navigation', 'aria-label': '分页' });
    host.appendChild(pager);

    function render() { renderHead(); renderBody(); renderPager(); updateSelBar(); }

    var api = {
      el: table,
      render: render,
      reload: function (rows, opts) {
        if (rows) { state.data = rows.slice(); }
        if (opts && opts.page === 'first') { state.page = 1; }
        state.page = Math.min(state.page, pageCount(filtered()));
        render();
      },
      setData: function (rows) { state.data = rows.slice(); state.page = 1; state.sel = {}; render(); },
      setLoading: function (on) {
        state.loading = !!on;
        if (on) { clear(tbody); clear(pager); tbody.appendChild(el('tr', { class: 'tbl-empty' }, el('td', {
          colspan: visibleCols().length + (cfg.selectable ? 1 : 0) + (cfg.opRender ? 1 : 0)
        }, null))); }
        renderBody();
        if (!on) { renderPager(); }
      },
      getSelection: function () {
        return state.data.filter(function (r) { return !!state.sel[keyOf(r)]; });
      },
      getFiltered: function () { return filtered(); },
      clearSelection: function () { state.sel = {}; render(); },
      getPage: function () { return state.page; },
      setTotal: function (n) { state.total = n; renderPager(); },
      setColumnVisible: function (key, visible) {
        if (visible) { delete state.hidden[key]; } else { state.hidden[key] = true; }
        render();
      },
      isColumnVisible: function (key) { return !state.hidden[key]; },
      sortBy: function (key, dir) { state.sortKey = key; state.sortDir = dir; render(); }
    };
    render();
    return api;
  }

  window.MOMCore = {
    $: $,
    $$: $$,
    el: el,
    appendKids: appendKids,
    svg: svg,
    clear: clear,
    text: text,
    cls: cls,
    debounce: debounce,
    fmtNum: fmtNum,
    pad: pad,
    todayStr: todayStr,
    nowStr: nowStr,
    csvCell: csvCell,
    toCSV: toCSV,
    download: download,
    storeGet: storeGet,
    storeSet: storeSet,
    guard: guard,
    tagFor: tagFor,
    deltaNode: deltaNode,
    emptyState: emptyState,
    icon: icon,
    iconHTML: iconHTML,
    sectionTitle: sectionTitle,
    createTable: createTable,
    Toast: Toast,
    Layers: Layers,
    Chart: Chart
  };
})();

</script>

  function renderNavList(host) {
    clear(host);

    if (kw) {

        return (l.name + l.group + l.module + l.path).indexOf(kw) >= 0;
      }).slice(0, 120);
      host.appendChild(el('div', { class: 'nav-hit', text: '命中 ' + hit.length + ' 个页面' }));

        it.appendChild(el('span', { class: 'side-txt', text: l.name }));

        if (S.current === l.id) { it.classList.add('active'); }
        it.addEventListener('click', function () { go(l.id); });
        host.appendChild(it);
      });
      if (!hit.length) {
        host.appendChild(emptyState({ title: '没有匹配的菜单', desc: '换个关键字试试，例如「检验」「入库」「看板」' }));

      head.appendChild(el('i', { class: 'side-caret' }));
      head.addEventListener('click', function () {
        S.navOpen[mod.id] = !S.navOpen[mod.id];
        renderSidebar();
      });
      g.appendChild(head);

      if (open) {
        var sub = el('div', { class: 'side-sub' });
        mod.groups.forEach(function (grp) {
          if (!grp.items.length) { return; }
          var gid = grp.id;
          var gOpen = S.navOpen[gid] !== false;
          if (mod.groups.length > 1) {
            var gh = el('button', { class: 'side-grp', type: 'button' });
            gh.setAttribute('data-act', 'nav-group');
            gh.appendChild(el('span', { class: 'side-caret' + (gOpen ? ' open' : ''), style: { transform: gOpen ? 'rotate(90deg)' : 'none' } }));
            gh.appendChild(el('span', { text: grp.name + '（' + grp.items.length + '）' }));
            gh.addEventListener('click', function () {
              S.navOpen[gid] = S.navOpen[gid] === false;
              renderSidebar();
            });
            sub.appendChild(gh);
          }
          if (!gOpen) { return; }
          grp.items.forEach(function (item) {
            var it = el('button', { class: 'side-item', type: 'button', title: item.path });
            it.setAttribute('data-act', 'nav');
            it.appendChild(el('span', { class: 'side-txt', text: item.name }));
            if (S.current === item.id) { it.classList.add('active'); }
            it.addEventListener('click', function () { go(item.id); });
            sub.appendChild(it);
          });
        });
        g.appendChild(sub);
      }
      host.appendChild(g);
    });

  function openTab(id) {
    var exists = S.tabs.some(function (t) { return t.id === id; });
    if (!exists) {
      S.tabs.push({ id: id, title: id === 'home' ? '首页' : (LEAF[id] ? LEAF[id].name : id) });
      persistTabs();
    }
  }
  function closeTab(id) {
    var i = S.tabs.findIndex(function (t) { return t.id === id; });
    if (i < 0) { return; }
    S.tabs.splice(i, 1);
    if (!S.tabs.length) { S.tabs.push({ id: 'home', title: '首页' }); }
    persistTabs();
    if (S.current === id) { go(S.tabs[Math.max(0, i - 1)].id); }
    else { renderTabs(); }
  }

  /* ============================================================
     4. 路由
     ============================================================ */
  function hashId() {
    var h = (location.hash || '').replace(/^#\/?/, '').trim();
    return h || 'home';
  }
  function go(id) {
    if (LEAF[id] || id === 'home' || id === '__selftest') {
      if (('#' + '/' + id) !== location.hash) { location.hash = '#/' + id; }
      else { render(); }
    } else {
      Toast.show('没有这个页面：' + id, 'warn');
    }
  }

  function render() {
    var id = hashId();
    if (id === '__selftest') { S.current = ''; renderTabs(); renderSidebar(); renderSelfTest(); return; }
    if (id !== 'home' && !LEAF[id]) {
      S.current = '';
      renderTabs(); renderSidebar();
      var v = $('#view'); clear(v);
      v.appendChild(emptyState({ title: '页面不存在', desc: '路由 ' + id + ' 不在菜单树中', action: linkBtn('回首页', function () { go('home'); }) }));
      return;
    }
    S.current = id;
    openTab(id);
    renderTabs();
    renderSidebar();
    var view = $('#view');
    clear(view);
    if (id === 'home') { renderHome(view); return; }
    renderPage(view, LEAF[id]);
    /* 滚动回顶部 */
    view.scrollTop = 0;
  }

  function kpiCard(k, i) {    var card = el('div', { class: 'kpi' + (k.tone ? ' alt' : '') });
    card.appendChild(el('div', { class: 'kpi-l', text: k.label }));
    var v = el('div', { class: 'kpi-v' });
    v.appendChild(text(k.value));
    if (k.unit) { v.appendChild(el('small', { text: k.unit })); }
    card.appendChild(v);
    var d = el('div', { class: 'kpi-d' });
    var raw = String(k.delta || (k.tone === 'danger' ? '-0.4' : '+1.8'));
    var sign = raw.indexOf('-') === 0 ? -1 : 1;
    var inverse = /不良|超期|停机|退货|报废|异常|缺陷|损耗/.test(k.label);
    var good = inverse ? sign < 0 : sign > 0;
    d.appendChild(el('span', { class: 'delta ' + (good ? 'up' : 'down'), text: (sign > 0 ? '▲ ' : '▼ ') + raw.replace('-', '') }));
    d.appendChild(el('span', { class: 'vs', text: '较昨日' }));
    card.appendChild(d);
    return card;
  }

  function filterNode(f, id) {
    var item = el('div', { class: 'f-item' });
    item.appendChild(el('label', { class: 'f-label', text: f.label, for: id }));
    var ctl = el('div', { class: 'f-ctl' });
    var get;
    if (f.type === 'daterange') {
      var d = el('div', { class: 'dtr' });
      var a = el('input', { class: 'inp', type: 'date', value: '2026-11-01', 'aria-label': f.label + ' 起' });
      var b = el('input', { class: 'inp', type: 'date', value: '2026-11-18', 'aria-label': f.label + ' 止' });
      d.appendChild(a); d.appendChild(el('span', { class: 'dtr-sp', text: '~' })); d.appendChild(b);
      ctl.appendChild(d);
      get = function () { return { from: a.value, to: b.value }; };
    } else if (f.type === 'select') {
      var sel = el('select', { class: 'sel', id: id });
      sel.appendChild(el('option', { value: '', text: '全部' }));
      (f.options || []).forEach(function (o) {
        if (o === '全部') { return; }
        sel.appendChild(el('option', { value: o, text: o }));
      });
      ctl.appendChild(sel);
      get = function () { return sel.value; };
    } else {
      var inp = el('input', { class: 'inp', id: id, type: 'text', placeholder: f.ph || '请输入', 'aria-label': f.label });
      ctl.appendChild(inp);
      get = function () { return inp.value.trim(); };
    }
    item.appendChild(ctl);
    return { node: item, get: get, label: f.label, type: f.type, reset: function () {
      var is = item.querySelectorAll('input,select');
      for (var i = 0; i < is.length; i++) { is[i].value = is[i].type === 'date' ? '' : ''; }
    } };
  }

  /* 迷你趋势线（内联 SVG，无依赖） */
  function sparkline(data) {
    var w = 96, h = 34, max = Math.max.apply(null, data), min = Math.min.apply(null, data);
    var span = (max - min) || 1;
    var pts = data.map(function (v, i) {
      var x = 2 + (i * (w - 4)) / (data.length - 1);
      var y = h - 3 - ((v - min) / span) * (h - 8);
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    var wrap = el('span', { class: 'spark' });
    wrap.innerHTML = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" aria-hidden="true">'
      + '<polyline points="' + pts + '" fill="none" stroke="#4aa8ff" stroke-width="1.6"/>'
      + '<polyline points="2,' + (h - 3) + ' ' + pts + ' ' + (w - 2) + ',' + (h - 3) + '" fill="rgba(120,190,255,.28)" stroke="none"/>'
      + '</svg>';
    return wrap;
  }

  function moduleIcon(name) {
    var m = { 配置中心: 'config', 仓库管理: 'warehouse', 计划管理: 'plan', 生产管理: 'production', 质量管理: 'quality', 数据中心: 'data', 公共应用: 'app' };
    return m[name] || 'app';
  }

  /* ============================================================
     7. 页面框架

  function specOf(leaf) {
    var sp = SPECS[leaf.id];
    if (sp) { return sp; }
    /* 兜底：菜单里有、规格缺失时也能渲染（保证 332 页无空白） */
    return {
      id: leaf.id, title: leaf.name, module: leaf.module, group: leaf.group, path: leaf.path,
      arch: leaf.arch, desc: '该页面规格待补充（兜底渲染）。',
      actions: [{ t: '新增', a: 'create', primary: true }, { t: '导出', a: 'export' }, { t: '刷新', a: 'refresh' }],
      rowActions: ['详情', '编辑'],
      filters: [{ label: '关键字', type: 'text', ph: '编码/名称/单号' }],
      cols: [{ key: 'code', title: '编号', w: 130 }, { key: 'name', title: '名称', w: 160 }, { key: 'status', title: '状态', w: 100 }],
      rows: [], stats: [], demo: true, fallback: true
    };
  }

      }));
    }

    stampCore(view);
  }

  /* ---------- 左表右图 报表布局（真实系统质量数据分析页） ---------- */
  function renderTableChartReport(view, ctx) {
    var spec = ctx.spec;
    var wrap = el('div', { class: 'tc-wrap' });

    /* 左：数据表 */
    var left = el('div', { class: 'tc-left' });
    var card = el('div', { class: 'card' });
    var hd = el('div', { class: 'card-hd' });
    hd.appendChild(el('span', { class: 'card-title', text: spec.title + ' 明细' }));
    var hr = el('div', { class: 'card-hd-r' });
