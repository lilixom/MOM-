    hd.appendChild(hr);
    card.appendChild(hd);
    var host = el('div', { class: 'tbl-wrap' });
    card.appendChild(host);
    left.appendChild(card);
    wrap.appendChild(left);

    /* 右：图表 + 基线 + 周期切换 */
    var right = el('div', { class: 'tc-right' });
    var chartCard = el('div', { class: 'card' });
    var chd = el('div', { class: 'tc-chart-hd' });
    var bl = el('div', { class: 'tc-baseline' });
    bl.appendChild(el('span', { class: 'tc-bl-label', text: '基线' }));
    var blInput = el('input', { class: 'inp tc-bl-input', type: 'text', value: spec.baseline || '' });
    blInput.addEventListener('change', function () {
      Toast.show('基线已改为 ' + blInput.value + (spec.baselineUnit || '') + '（演示：图表参照线同步）', 'ok');
      paint();
    });
    bl.appendChild(blInput);
    bl.appendChild(el('span', { class: 'tc-bl-unit', text: spec.baselineUnit || '' }));
    chd.appendChild(bl);

    var seg = el('div', { class: 'seg tc-period' });
    (spec.periods || ['日', '周', '月']).forEach(function (p, i) {
      var b = el('button', { class: i === 0 ? 'on' : '', type: 'button', text: p });
      b.addEventListener('click', function () {
        var all = seg.querySelectorAll('button');
        for (var j = 0; j < all.length; j++) { all[j].classList.remove('on'); }
        b.classList.add('on');
        Toast.show('周期切换为「' + p + '」（演示：数据粒度变化）', 'info');
        paint();
      });
      seg.appendChild(b);
    });
    chd.appendChild(seg);
    chartCard.appendChild(chd);

    var titleEl = el('div', { class: 'tc-chart-title', text: spec.chartTitle || spec.title });
    chartCard.appendChild(titleEl);
    var cHost = el('div', { class: 'tc-chart-host' });
    chartCard.appendChild(cHost);
    var legend = el('div', { class: 'legend' });
    chartCard.appendChild(legend);
    right.appendChild(chartCard);
    wrap.appendChild(right);
    view.appendChild(wrap);

    function paint() {
      var ch = spec.chart || {};
      var base = parseFloat(blInput.value);
      var w = cHost.clientWidth || cHost.parentNode && cHost.parentNode.clientWidth || 0;
      /* 容器还没布局出宽度时，等一帧再画（避免 headless / 首屏空白） */
      if (!w) {
        setTimeout(function () { if (document.body.contains(cHost)) { paint(); } }, 120);
        return;
      }
      Chart.render(cHost, {
        type: ch.type || 'line',
        labels: ch.labels || [],
        series: (ch.series || []).map(function (s) { return { name: s.name, values: s.values || [] }; }),
        /* 真实系统的「基线」只是输入框，不在图上画参考线 */
        control: null,
        height: 320
      }, legend);
    }
    setTimeout(function () { if (document.body.contains(cHost)) { paint(); } }, 60);
    setTimeout(function () { if (document.body.contains(cHost)) { paint(); } }, 400);
    setTimeout(function () { if (document.body.contains(cHost)) { paint(); } }, 1200);

    ctx.table = createTable(host, {
      columns: (spec.cols || []).map(function (c) { return { key: c.key, title: c.title, w: c.w || 130, sort: true, filter: false, type: c.type }; }),
      rows: ctx.rows,
      pageSize: 10,
      rowKey: function (r) { return r.__id || String(r); },
      opTitle: '',
      opWidth: 0
    });
  }

  /* ---------- 子表（主从结构） ---------- */
  function renderSubTable(view, ctx) {
    var sub = ctx.spec.subTable;

  /* ---------- 报表页趋势图（取首列做维度、数值列做指标） ---------- */
  function renderReportChart(view, ctx) {
    var spec = ctx.spec;
    var cols = spec.cols || [];
    var numCols = cols.filter(function (c) {
      return /数量|金额|率|占比|数$|工时|天|次数|量/.test(c.title) && !/号|编码|编号/.test(c.title);
    }).slice(0, 2);
    if (!numCols.length || (ctx.rows || []).length < 4) { return; }
    var labelCol = cols.filter(function (c) { return /日期|时间|线体|仓库|产品|班次|供应商|客户|物料/.test(c.title); })[0] || cols[0];

    var card = el('div', { class: 'card' });
    var hd = el('div', { class: 'chart-hd' });
    hd.appendChild(el('span', { class: 'card-title', text: spec.title + ' · 趋势分析' }));
    var hr = el('div', { class: 'chart-hd-r' });
    var seg = el('div', { class: 'seg' });
    var kind = 'bar';
    [['bar', '柱状'], ['line', '折线']].forEach(function (k, i) {
      var b = el('button', { class: i === 0 ? 'on' : '', type: 'button', text: k[1] });
      b.setAttribute('data-act', 'report-chart-kind');
      b.addEventListener('click', function () {
        var all = seg.querySelectorAll('button');
        for (var j = 0; j < all.length; j++) { all[j].classList.remove('on'); }
        b.classList.add('on');
        kind = k[0];
        paint();
      });
      seg.appendChild(b);
    });
    hr.appendChild(seg);
    hd.appendChild(hr);
    card.appendChild(hd);
    var host = el('div', { class: 'chart-host' });
    card.appendChild(host);
    var legend = el('div', { class: 'legend' });
    card.appendChild(legend);
    view.appendChild(card);

    function paint() {
      var rows = (ctx.rows || []).slice(0, 12);
      Chart.render(host, {
        type: kind,
        labels: rows.map(function (r) { return String(r[labelCol.key] === undefined ? '' : r[labelCol.key]); }),
        height: 240,
        series: numCols.map(function (c) {
          return {
            name: c.title.replace(/[（(].*?[)）]/g, '').trim() || c.title,
            values: rows.map(function (r) {
              var v = parseFloat(String(r[c.key]).replace(/[,%]/g, ''));
              return isFinite(v) ? v : 0;
            })
          };
        })
      }, legend);
    }
    setTimeout(function () { if (document.body.contains(host)) { paint(); } }, 50);
  }

  /* 给组件库内部生成的按钮（分页 / 列筛选 / 批量条 / 勾选框）打上交互标记，
     引擎自建按钮在创建时已带 data-act；自检据此判定「无死按钮」 */
  function stampCore(scope) {
    if (!scope || !scope.querySelectorAll) { return; }
    var bs = scope.querySelectorAll('button:not([data-act])');

  /* 全局单一计时器：驱动所有页面的「已选择 N 条」提示，页面切走自动移除 */

  function mapColumns(spec) {
    return (spec.cols || []).map(function (c) {
      /* 显式 type 优先（tag / switch / status / num），推断只做兜底 */
      var col = { key: c.key, title: c.title, w: c.w || 120, sort: c.sort !== false, filter: !!c.filter, type: c.type };
      var t = String(c.title);
      if (!col.type) {
        if (STATUS_KEYS[c.key] || /状态|判定|等级|是否/.test(t)) {
          col.type = 'status';
        }
        else if (/率|占比|百分比/.test(t) && !/数量/.test(t)) { col.type = 'num'; }
        else if (/^(qty|amount|price|qty2|num1|num2|seq|hour|days|ageDays|diff)$/.test(c.key)) { col.type = 'num'; }
      }
      if (col.type === 'status') { col.w = Math.max(col.w, 104); }   /* 状态标签不截断 */
      return col;
    });

  function rowOps(ctx, row) {

        else if (t === '删除') {

            title: '删除确认', danger: true, text: '确认删除该记录？',

        } else if (t === '打印') { openPrint(ctx, row); }
        else if (t === '钻取') { drill(ctx, row); }
        else if (t === '导出') { exportCsv(ctx.spec, [row]); }
        else if (t === '查看曲线') { openCurve(ctx, row); }

      });
      box.appendChild(b);
    });

  }

  /* ============================================================
     8.6 追溯三页「按真实截图重绘」渲染器
     p306 产品追溯 / p307 物料追溯 / p308 单据产品追溯
     由 spec.traceLayout 驱动：query / master / left.panels / right.basic / right.tabs[].tables
     复用 core.js 的 createTable：排序、分页、勾选、列筛选等交互全部保留
     ============================================================ */
  function tl2Cols(cols) {
    return (cols || []).map(function (c) {
      return { key: c.key, title: c.title, w: c.w || 120, sort: c.sort !== false, filter: false, type: c.type };
    });
  }
  function tl2Rows(rows) {
    return (rows || []).map(function (r, i) {
      var o = {};
      for (var k in r) { if (Object.prototype.hasOwnProperty.call(r, k)) { o[k] = r[k]; } }
      if (!o.__id) { o.__id = 'tl2-' + i; }
      return o;
    });
  }
  function tl2Empty(txt) {
    var box = el('div', { class: 'tl2-empty' });
    box.appendChild(el('div', { class: 'tl2-empty-ill' }));
    box.appendChild(el('span', { text: txt || '暂无数据' }));
    return box;
  }
  function tl2Gear() {
    var g = el('span', { class: 'tl2-gear', text: '⚙', title: '列设置' });
    g.setAttribute('data-act', 'trace-gear');
    g.addEventListener('click', function (e) {
      e.stopPropagation();
      Toast.show('列设置（演示）：可勾选要显示的列', 'info');
    });
    return g;
  }
  function tl2SetBasic(node, label, value) {
    if (!node) { return; }
    var fis = node.querySelectorAll('.tl2-fi');
    for (var i = 0; i < fis.length; i++) {
      var lb = fis[i].querySelector('label');
      if (lb && lb.textContent === label) {
        var v = fis[i].querySelector('.v');
        if (v) { v.textContent = value; v.classList.remove('blank'); }
        return;
      }
    }
  }

  /* 单个表格卡（标签页内 / 主表共用） */
  function buildTraceTable(t, spec) {
    var card = el('div', { class: 'tl2-tblcard' + (!(t.rows || []).length ? ' no-data' : '') });
    if (t.gear !== false) { card.appendChild(tl2Gear()); }
    var host = el('div', {});
    card.appendChild(host);
    var rows = tl2Rows(t.rows);
    var api = createTable(host, {
      columns: tl2Cols(t.cols), rows: rows,
      pageSize: t.pageSize || 10,
      total: t.total !== undefined ? t.total : rows.length,
      rowKey: function (r) { return r.__id; },
      selectable: !!t.selectable,
      maxHeight: t.maxHeight || null
    });
    var emp = host.querySelector('.tbl-empty td');
    if (emp) { clear(emp); emp.appendChild(tl2Empty(t.emptyText)); }
    card.__api = api;
    return card;
  }

  /* 左侧面板：空态 或 可点选的列表 */
  function buildTracePanel(p, spec, basicNode) {
    var card = el('div', { class: 'tl2-panel' });
    var hd = el('div', { class: 'tl2-panel-hd' });
    hd.appendChild(el('span', { text: p.title || '' }));
    if (p.gear !== false) { hd.appendChild(tl2Gear()); }
    card.appendChild(hd);
    if (p.type === 'empty' || !(p.cols || []).length) {
      card.appendChild(tl2Empty(p.emptyText));
      return card;
    }
    var host = el('div', { class: 'tl2-tblhost' });
    card.appendChild(host);
    var rows = tl2Rows(p.rows);
    createTable(host, {
      columns: tl2Cols(p.cols), rows: rows,
      pageSize: p.pageSize || 10,
      total: p.total !== undefined ? p.total : rows.length,
      rowKey: function (r) { return r.__id; },
      selectable: !!p.selectable
    });
    var trs = host.querySelectorAll('tbody tr');
    for (var i = 0; i < trs.length; i++) {
      (function (tr, idx) {
        if (tr.classList.contains('tbl-empty')) { return; }
        tr.classList.add('tl2-row');
        if (idx === (p.active || 0)) { tr.classList.add('on'); }
        tr.addEventListener('click', function () {
          var all = host.querySelectorAll('tbody tr.tl2-row');
          for (var j = 0; j < all.length; j++) { all[j].classList.remove('on'); }
          tr.classList.add('on');
          var r = rows[idx] || {};
          if (p.linkLabel && p.linkKey) { tl2SetBasic(basicNode, p.linkLabel, r[p.linkKey] || ''); }
          Toast.show('已切换：' + (r[p.linkKey] || ('第 ' + (idx + 1) + ' 条')), 'info');
        });
      })(trs[i], i);
    }
    return card;
  }

  /* 标签页 + 每标签下 1~N 张表 */
  function buildTraceTabs(R, spec) {
    var wrap = el('div', {});
    var strip = el('div', { class: 'tl2-tabs' });
    var tabs = R.tabs || [];
    var active = R.activeTab || 0;
    var panes = tabs.map(function (t) {
      var pane = el('div', { class: 'tl2-tabpane' });
      var tbs = t.tables || [];
      if (!tbs.length) { pane.appendChild(tl2Empty(t.emptyText)); }
      else { tbs.forEach(function (tb) { pane.appendChild(buildTraceTable(tb, spec)); }); }
      pane.style.display = 'none';
      return pane;
    });
    tabs.forEach(function (t, i) {
      var b = el('button', { class: 'tl2-tab' + (i === active ? ' on' : ''), type: 'button', text: t.name });
      b.setAttribute('data-act', 'trace-tab');
      b.addEventListener('click', function () {
        for (var j = 0; j < strip.children.length; j++) { strip.children[j].classList.remove('on'); }
        b.classList.add('on');
        panes.forEach(function (p, k) { p.style.display = k === i ? '' : 'none'; });
        Toast.show('已切换到「' + t.name + '」', 'info');
      });
      strip.appendChild(b);
    });
    wrap.appendChild(strip);
    panes.forEach(function (p) { wrap.appendChild(p); });
    if (panes[active]) { panes[active].style.display = ''; }
    return wrap;
  }

  /* 顶部查询条：普通关键字（p306/p307） / 高级条件（p308） */
  function buildTraceQuery(q, spec) {
    var bar = el('div', { class: 'tl2-qbar' });
    var inputs = [];
    var row1 = el('div', { class: 'tl2-qrow' });
    var fOrg = el('div', { class: 'tl2-field' });
    fOrg.appendChild(el('label', { text: '组织机构' }));
    var sel = el('select', { class: 'tl2-sel' });
    (q.orgs || [q.org || '昇兴集团-中山制罐工厂']).forEach(function (o) { sel.appendChild(el('option', { value: o, text: o })); });
    fOrg.appendChild(sel);
    row1.appendChild(fOrg);
    bar.appendChild(row1);

    var btns = q.buttons || [{ t: '查询', a: 'query', primary: true }, { t: '导出', a: 'export' }];
    function makeBtn(b) {
      var n = el('button', {
        class: b.icon ? 'tl2-iconbtn' : ('tl2-btn' + (b.primary ? ' primary' : '')),
        type: 'button', text: b.t, title: b.t
      });
      n.setAttribute('data-act', 'trace-' + (b.a || 'misc'));
      n.addEventListener('click', function () {
        if (b.a === 'export') {
          var L = spec.traceLayout || {};
          var t = null;
          if (L.right && L.right.tabs && L.right.tabs[L.right.activeTab || 0]) {
            t = (L.right.tabs[L.right.activeTab || 0].tables || [])[0];
          }
          if (!t && L.master) { t = L.master; }
          if (!t && L.left && L.left.panels) {
            for (var i = 0; i < L.left.panels.length; i++) { if ((L.left.panels[i].rows || []).length) { t = L.left.panels[i]; break; } }
          }
          if (t) { exportCsv({ title: spec.title, cols: t.cols }, tl2Rows(t.rows), '追溯明细'); }
          else { Toast.show('没有可导出的数据', 'warn'); }
        } else if (b.a === 'reset') {
          inputs.forEach(function (i) { i.value = ''; });
          Toast.show('查询条件已重置', 'info');
        } else if (b.a === 'gear') {
          Toast.show('列设置（演示）：可配置查询区显示项', 'info');
        } else if (b.a === 'fold') {
          Toast.show('已收起 / 展开更多查询条件', 'info');
        } else {
          Toast.show('查询完成：已按条件加载追溯数据', 'ok');
        }
      });
      return n;
    }

    if (q.advanced && q.advanced.length) {
      var grid = el('div', { class: 'tl2-qrow tl2-adv' });
      q.advanced.forEach(function (a) {
        var f = el('div', { class: 'tl2-field' });
        f.appendChild(el('label', { text: a.label }));
        var w = el('div', { class: 'tl2-opwrap' });
        var op = el('select', { class: 'tl2-sel' });
        ['包含', '等于', '不等于'].forEach(function (x) { op.appendChild(el('option', { value: x, text: x })); });
        w.appendChild(op);
        var inp = el('input', { class: 'tl2-inp', type: 'text', value: a.value || '', placeholder: a.ph || '请输入' });
        w.appendChild(inp);
        inputs.push(inp);
        f.appendChild(w);
        grid.appendChild(f);
      });
      bar.appendChild(grid);
      var right = el('div', { class: 'tl2-qright abs' });
      btns.forEach(function (b) { right.appendChild(makeBtn(b)); });
      bar.appendChild(right);
    } else {
      var row2 = el('div', { class: 'tl2-qrow' });
      var kw = el('input', { class: 'tl2-inp kw', type: 'text', value: q.keyword || '', placeholder: q.ph || '请输入SN' });
      inputs.push(kw);
      row2.appendChild(kw);
      btns.forEach(function (b) { row2.appendChild(makeBtn(b)); });
      bar.appendChild(row2);
    }
    return bar;
  }

  /* 主渲染入口 */
  function renderTraceLayout(view, ctx) {
    var spec = ctx.spec;
    var L = spec.traceLayout || {};
    ctx.table = null;
    view.appendChild(buildTraceQuery(L.query || {}, spec));
    if (L.master) {
      var mcard = el('div', { class: 'tl2-master' });
      if (L.master.gear !== false) { mcard.appendChild(tl2Gear()); }
      var mhost = el('div', {});
      mcard.appendChild(mhost);
      ctx.table = createTable(mhost, {
        columns: tl2Cols(L.master.cols), rows: tl2Rows(L.master.rows),
        pageSize: L.master.pageSize || 10,
        total: L.master.total !== undefined ? L.master.total : (L.master.rows || []).length,
        rowKey: function (r) { return r.__id; },
        selectable: !!L.master.selectable
      });
      view.appendChild(mcard);
    }
    var split = el('div', { class: 'tl2-split' });
    var lc = el('div', { class: 'tl2-left' });
    var rc = el('div', { class: 'tl2-right' });
    if (L.left && L.left.width) { lc.style.width = L.left.width + 'px'; lc.style.flexBasis = L.left.width + 'px'; }
    var basicNode = (L.right && L.right.basic) ? buildTraceBasic(L.right.basic) : null;
    ((L.left && L.left.panels) || []).forEach(function (p) { lc.appendChild(buildTracePanel(p, spec, basicNode)); });
    if (basicNode) { rc.appendChild(basicNode); }
    rc.appendChild(buildTraceTabs(L.right || {}, spec));
    split.appendChild(lc);
    split.appendChild(rc);
    view.appendChild(split);
  }

  /* ---------- IOT 采集 ---------- */
  function renderIot(view, ctx) {
    var spec = ctx.spec;
    var card = el('div', { class: 'card' });
    var hd = el('div', { class: 'chart-hd' });
    hd.appendChild(el('span', { class: 'card-title', text: '设备采集曲线（近 24 小时）' }));
    var hr = el('div', { class: 'chart-hd-r' });
    var live = el('span', { class: 'mini-badge', text: '自动刷新：关闭' });
    hr.appendChild(live);
    var bLive = btn('开启自动刷新', 'default', 'iot-live', { sm: true });
    var timer = null;
    bLive.addEventListener('click', function () {
      if (timer) {
        clearInterval(timer); timer = null; live.textContent = '自动刷新：关闭';
        bLive.textContent = '开启自动刷新';
        Toast.show('已停止自动刷新', 'info');
      } else {
        timer = setInterval(function () {
          var arr = [];
          for (var i = 0; i < 24; i++) { arr.push(60 + Math.round(Math.random() * 18)); }
          if (document.body.contains(host)) {
            Chart.render(host, { type: 'line', labels: hours(), series: [{ name: '采集值', values: arr }], height: 240 }, legend);
          }
        }, 3000);
        live.textContent = '自动刷新：开启（3 秒）';
        bLive.textContent = '停止自动刷新';
        Toast.show('已开启自动刷新（每 3 秒刷新一次演示数据）', 'ok');
      }
    });
    hr.appendChild(bLive);
    hd.appendChild(hr);
    card.appendChild(hd);
    var host = el('div', { class: 'chart-host', 'data-chart': '1' });
    card.appendChild(host);
    var legend = el('div', { class: 'legend' });
    card.appendChild(legend);
    view.appendChild(card);

    function hours() { var a = []; for (var i = 0; i < 24; i++) { a.push(String(i).padStart(2, '0') + ':00'); } return a; }
    setTimeout(function () {
      if (!document.body.contains(host)) { return; }
      var arr = []; for (var i = 0; i < 24; i++) { arr.push(60 + Math.round(Math.random() * 18)); }
      Chart.render(host, { type: 'line', labels: hours(), series: [{ name: '采集值', values: arr }], height: 240 }, legend);
    }, 30);

    renderTablePage(view, ctx);
  }

  /* ============================================================
     8. 动作（所有按钮的落地行为）
     ============================================================ */
  function runAction(a, ctx, label) {
    var spec = ctx.spec;
    switch (a) {
      case 'query': actQuery(ctx); break;
      case 'create': openForm(ctx, null, 'create'); break;
      case 'edit': {
        var sel = ctx.table ? ctx.table.getSelection() : [];
        if (!sel.length) { Toast.show('请先勾选一行再点编辑', 'warn'); return; }
        openForm(ctx, sel[0], 'edit'); break;
      }
      case 'delete': {
        var sel2 = ctx.table ? ctx.table.getSelection() : [];
        if (!sel2.length) { Toast.show('请先勾选要删除的记录', 'warn'); return; }
        confirmDlg({
          title: '删除确认', danger: true, text: '确认删除选中的 ' + sel2.length + ' 条记录？',
          onOk: function () {
            var ids = {}; sel2.forEach(function (r) { ids[r.__id] = 1; });
            ctx.rows = ctx.rows.filter(function (r) { return !ids[r.__id]; });
            if (ctx.table) { ctx.table.setData(ctx.rows); }
            Toast.show('已删除 ' + sel2.length + ' 条（演示）', 'ok');
          }
        });
        break;
      }
      case 'audit': audit(ctx, '已审核'); break;
      case 'unaudit': audit(ctx, '待审核'); break;
      case 'toggle': {
        var sel3 = ctx.table ? ctx.table.getSelection() : [];
        if (!sel3.length) { Toast.show('请先勾选记录', 'warn'); return; }
        confirmDlg({
          title: '启用/停用', text: '对选中 ' + sel3.length + ' 条记录切换启用状态？',
          onOk: function () {
            sel3.forEach(function (r) { if (r.flag !== undefined) { r.flag = r.flag === '停用' ? '启用' : '停用'; } });
            if (ctx.table) { ctx.table.setData(ctx.rows); }
            Toast.show('已切换 ' + sel3.length + ' 条记录状态', 'ok');
          }
        });
        break;
      }
      case 'export': exportCsv(spec, ctx.table ? ctx.table.getFiltered() : ctx.rows); break;
      case 'import': openImport(ctx); break;
      case 'print': openPrint(ctx, null); break;
      case 'refresh': doRefresh(ctx); break;
      case 'columns': openColumnSettings(ctx); break;
      case 'fullscreen': doFullscreen(); break;
      case 'exportImg': doExportImg(ctx); break;
      case 'range': openRange(ctx); break;
      default: Toast.show('「' + (label || a || '该') + '」在正式系统中执行对应业务动作；原型中演示为提示（字段与按钮位置均取自真实系统）', 'info');
    }
  }

  function actQuery(ctx) {
    var spec = ctx.spec;
    var conds = ctx.filters.map(function (f) { return { label: f.label, type: f.type, v: f.get() }; });
    var rows = (spec.rows || []).slice();
    conds.forEach(function (c) {
      if (c.type === 'daterange') { return; }   /* 日期范围：演示数据不按真实日期过滤 */
      var v = c.v;
      if (!v || v === '全部') { return; }
      rows = rows.filter(function (r) {
        for (var k in r) {
          if (k === '__id') { continue; }
          if (String(r[k]).indexOf(v) >= 0) { return true; }
        }
        return false;
      });
    });
    ctx.rows = rows;
    if (ctx.table) { ctx.table.setData(rows); }
    Toast.show('查询完成：命中 ' + rows.length + ' 条记录' + (conds.filter(function (c) { return c.v && c.type !== 'daterange'; }).length ? '（已应用 ' + conds.filter(function (c) { return c.v && c.type !== 'daterange'; }).length + ' 个条件）' : ''), rows.length ? 'ok' : 'warn');
  }

  function audit(ctx, next) {
    var sel = ctx.table ? ctx.table.getSelection() : [];
    if (!sel.length) { Toast.show('请先勾选要审核的记录', 'warn'); return; }
    confirmDlg({
      title: next === '已审核' ? '审核确认' : '反审核确认',
      text: '确认将选中的 ' + sel.length + ' 条记录置为「' + next + '」？',
      onOk: function () {
        sel.forEach(function (r) { if (r.status !== undefined) { r.status = next; } });
        if (ctx.table) { ctx.table.setData(ctx.rows); }
        Toast.show('已' + (next === '已审核' ? '审核' : '反审核') + ' ' + sel.length + ' 条记录', 'ok');
      }
    });
  }

  function doRefresh(ctx) {
    if (ctx.table && ctx.table.setLoading) {
      ctx.table.setLoading(true);
      setTimeout(function () { ctx.table.setLoading(false); Toast.show('已刷新（演示数据）', 'ok'); }, 600);
    } else {
      Toast.show('已刷新（演示数据）', 'ok');
      render();
    }
  }

  function doFullscreen() {
    try {
      if (!document.fullscreenElement) {
        (document.documentElement.requestFullscreen || function () {}).call(document.documentElement);
        Toast.show('已进入全屏，按 Esc 退出', 'ok');
      } else {
        document.exitFullscreen();
        Toast.show('已退出全屏', 'info');
      }
    } catch (e) { Toast.show('当前环境不支持全屏（浏览器策略限制）', 'warn'); }
  }

  function doExportImg(ctx) {
    var hosts = $$('.chart-host');
    var svgNode = null;
    for (var i = 0; i < hosts.length; i++) {
      var s = hosts[i].querySelector('svg');
      if (s) { svgNode = s; break; }
    }
    if (!svgNode) { Toast.show('本页没有可导出的图表', 'warn'); return; }
    var src = '<?xml version="1.0" encoding="UTF-8"?>\n' + svgNode.outerHTML;
    download(ctx.spec.title + '-图表.svg', src, 'image/svg+xml');
    Toast.show('图表已导出为 SVG 文件', 'ok');
  }

  function openRange(ctx) {
    Layers.modal({
      title: '选择时间范围',
      width: 420,
      body: '<div class="form-grid">' + ['今日', '本周', '本月', '本季度', '本年'].map(function (t, i) {
        return '<label class="form-item"><input type="radio" name="rng" value="' + t + '"' + (i === 2 ? ' checked' : '') + '> <span style="margin-left:6px">' + t + '</span></label>';
      }).join('') + '</div>',
      buttons: [
        { text: '取消' },
        { text: '应用', type: 'primary', onClick: function (api) {
          var v = api.body.querySelector('input[name=rng]:checked');
          Toast.show('时间范围已切换为「' + (v ? v.value : '本月') + '」，看板数据随之刷新（演示）', 'ok');
          render();
        } }
      ]
    });
  }

  function openColumnSettings(ctx) {
    var box = el('div', { class: 'colset' });
    var cbs = [];
    (ctx.spec.cols || []).forEach(function (c) {
      var row = el('label', { class: 'colset-item' });
      var cb = el('input', { type: 'checkbox' });
      cb.checked = ctx.table ? ctx.table.isColumnVisible(c.key) : true;
      cb.addEventListener('change', function () {
        if (ctx.table) { ctx.table.setColumnVisible(c.key, cb.checked); }
      });
      row.appendChild(cb);
      row.appendChild(el('span', { text: c.title }));
      box.appendChild(row);
      cbs.push(cb);
    });
    Layers.modal({
      title: '列设置（勾选显示，取消隐藏）',
      width: 520,
      body: box,
      buttons: [
        { text: '全部显示', onClick: function () { cbs.forEach(function (cb) { cb.checked = true; if (ctx.table) { ctx.table.setColumnVisible(cb.value, true); } }); return false; } },
        { text: '关闭' }
      ]
    });
  }

  /* ---------- 表单弹层 ---------- */
  /* 页面自带表单定义（spec.form）时，按定义渲染；否则回落到"用表头当字段" */
  function buildCustomForm(ctx, spec, row, mode) {
    var form = spec.form;
    var body = el('div', { class: 'cf' });
    var inputs = [];

    (form.groups || []).forEach(function (grp) {
      if (grp.name) { body.appendChild(el('div', { class: 'cf-group', text: grp.name })); }
      var grid = el('div', { class: 'cf-grid' });
      (grp.fields || []).forEach(function (f) {
        var item = el('div', { class: 'cf-item' + (f.span === 2 ? ' cf-span2' : '') });
        var lb = el('label', { class: 'cf-label' });
        if (f.required) { lb.appendChild(el('i', { class: 'req-tip', text: '*' })); }
        lb.appendChild(text(f.label));
        item.appendChild(lb);

        var ctl = null;
        if (f.type === 'select') {
          ctl = el('select', { class: 'sel' });
          ctl.appendChild(el('option', { value: '', text: f.ph || '请选择' }));
          (f.options || []).forEach(function (o) { ctl.appendChild(el('option', { value: o, text: o })); });
          item.appendChild(ctl);
        } else if (f.type === 'switch') {
          var sw = el('label', { class: 'cf-switch' });
          var cb = el('input', { type: 'checkbox' });
          cb.checked = true;
          var track = el('span', { class: 'cf-track' });
          sw.appendChild(cb);
          sw.appendChild(track);
          item.appendChild(sw);
          ctl = cb;
        } else if (f.type === 'upload') {
          var wrap = el('div', { class: 'cf-upload' });
          var picker = el('div', { class: 'cf-upload-add' });
          picker.appendChild(el('span', { text: '+' }));
          var thumbs = el('div', { class: 'cf-thumbs' });
          var finp = el('input', { type: 'file', accept: 'image/*', multiple: 'multiple' });
          finp.style.display = 'none';
          var countEl = el('div', { class: 'cf-upload-cnt', text: '已选 0 / 9' });
          picker.addEventListener('click', function () { finp.click(); });
          finp.addEventListener('change', function () {
            var n = Math.min(finp.files.length, 9);
            clear(thumbs);
            for (var i = 0; i < n; i++) {
              var th = el('div', { class: 'cf-thumb' });
              try {
                var u = URL.createObjectURL(finp.files[i]);
                th.style.backgroundImage = 'url(' + u + ')';
              } catch (e) {}
              thumbs.appendChild(th);
            }
            countEl.textContent = '已选 ' + n + ' / 9';
            Toast.show('已选择 ' + n + ' 张图片（演示：不实际上传）', 'ok');
          });
          function thths(node) { thumbs.appendChild(node); }
          wrap.appendChild(picker);
          wrap.appendChild(thumbs);
          wrap.appendChild(finp);
          item.appendChild(wrap);
          if (f.hint) { item.appendChild(el('div', { class: 'cf-upload-hint', text: f.hint })); }
          item.appendChild(countEl);
          ctl = { value: '' };
        } else {
          ctl = el('input', { class: 'inp', type: 'text', placeholder: f.ph || '请输入' });
          item.appendChild(ctl);
        }

        if (row && f.key && row[f.key] !== undefined && ctl && ctl.value !== undefined) {
          ctl.value = row[f.key];
        }
        grid.appendChild(item);
        inputs.push({ key: f.key, label: f.label, required: !!f.required, type: f.type, node: ctl });
      });
      body.appendChild(grid);
    });

    body.appendChild(el('div', {
      class: 'cf-hint',
      text: '带 * 为必填项。演示原型：图片不会真正上传，保存后数据写入当前列表。'
    }));

    var btns = (form.buttons || [{ text: '取消' }, { text: '保存', type: 'primary' }]).map(function (b) {
      return {
        text: b.text,
        type: b.type || 'default',
        /* 注意：Layers.modal 的 onClick 返回 false 才阻止关闭，返回 true/undefined 都会关闭 */
        onClick: function (api) {
          if (b.text === '取消') { return true; }
          var bad = inputs.filter(function (x) { return x.required && (!x.node || !String(x.node.value || '').trim()); });
          if (bad.length) {
            Toast.show('请填写必填项：' + bad.map(function (x) { return x.label; }).join('、'), 'warn');
            return false;
          }
          var obj = { __id: 'new-' + Date.now() };
          inputs.forEach(function (x) {
            var v = '';
            try {
              if (x.node) {
                if (x.type === 'switch') { v = x.node.checked ? '启用' : '停用'; }
                else { v = String(x.node.value === undefined ? '' : x.node.value); }
              }
            } catch (e) { v = ''; }
            obj[x.key] = v;
          });
          var out = { __id: obj.__id };
          (spec.cols || []).forEach(function (c) {
            var m = inputs.filter(function (x) { return x.label === c.title; })[0];
            if (m) { out[c.key] = obj[m.key]; }
            else if (row && row[c.key] !== undefined) { out[c.key] = row[c.key]; }
            else { out[c.key] = c.title === '创建人' ? '苏军辉' : (c.title === '创建时间' ? new Date().toLocaleString('zh-CN') : (c.title === '有效标志' ? '启用' : '')); }
          });
          try {
            if (mode === 'create') { ctx.rows.unshift(out); }
            else if (row) { Object.keys(out).forEach(function (k) { row[k] = out[k]; }); }
            if (ctx.table && ctx.table.setData) { ctx.table.setData(ctx.rows); }
          } catch (e2) {
            if (window.console) { console.warn('[form] 写入表格失败', e2); }
          }
          Toast.show(b.text === '保存不退出' ? '已保存，可继续新增' : '保存成功，已追加到列表首行', 'ok');
          if (b.text === '保存不退出') {
            /* 清空表单，方便连续录入 */
            inputs.forEach(function (x) {
              if (!x.node) { return; }
              if (x.type === 'switch') { x.node.checked = true; }
              else if (x.type === 'select') { x.node.value = ''; }
              else if (x.node.value !== undefined) { x.node.value = ''; }
            });
            return false;
          }
          return true;
        }
      };
    });

    /* 表单形态：drawer（右侧抽屉，真实系统新增常见）或 modal（居中弹窗） */
    if (spec.form.layout === 'drawer') {
      return Layers.drawer({
        title: (mode === 'create' ? '+ ' : '') + (spec.form.title || ('新增 · ' + spec.title)),
        width: spec.form.width || 620,
        body: body,
        footer: btns.map(function (b) {
          return {
            text: b.text,
            type: b.type,
            onClick: function () { b.onClick && b.onClick(null); }
          };
        })
      });
    }
    return Layers.modal({
      title: (mode === 'create' ? '+ ' : '') + (spec.form.title || ('新增 · ' + spec.title)),
      width: spec.form.width || 760,
      body: body,
      buttons: btns
    });
  }

  function openForm(ctx, row, mode) {
    var spec = ctx.spec;
    if (spec.form && spec.form.groups) { return buildCustomForm(ctx, spec, row, mode); }
    var fields = (spec.cols || []).slice(0, 10);
    var grid = el('div', { class: 'form-grid' });
    var inputs = [];
    fields.forEach(function (c, i) {
      var item = el('div', { class: 'form-item' });
      var lb = el('label', { class: 'form-label' });
      lb.appendChild(text(c.title));
      if (i < 3) { lb.appendChild(el('i', { class: 'req-tip', text: '*' })); }
      item.appendChild(lb);
      var ctl;
      var isStatus = STATUS_KEYS[c.key] || /状态|判定|等级|是否/.test(c.title);
      if (isStatus) {
        ctl = el('select', { class: 'sel' });
        ['启用', '停用', '草稿', '待审核', '已审核', '合格', '不合格'].forEach(function (o) { ctl.appendChild(el('option', { value: o, text: o })); });
      } else {
        ctl = el('input', { class: 'inp', type: 'text', placeholder: '请输入' + c.title });
      }
      if (row) { ctl.value = row[c.key] === undefined ? '' : row[c.key]; }
      item.appendChild(ctl);
      grid.appendChild(item);
      inputs.push({ key: c.key, node: ctl, required: i < 3, title: c.title });
    });
    var hint = el('div', { class: 'form-hint', text: mode === 'create' ? '带 * 为必填项；提交后写入演示数据并出现在列表中。' : '修改后立即写回当前列表（演示数据）。' });
    var wrap = el('div', {});
    wrap.appendChild(grid);
    wrap.appendChild(hint);

    Layers.modal({
      title: (mode === 'create' ? '新增 · ' : '编辑 · ') + spec.title,
      width: 760,
      body: wrap,
      buttons: [
        { text: '取消' },
        {
          text: mode === 'create' ? '提交' : '保存', type: 'primary', onClick: function (api) {
            var bad = inputs.filter(function (x) { return x.required && !String(x.node.value).trim(); });
            if (bad.length) {
              Toast.show('请填写必填项：' + bad.map(function (b) { return b.title; }).join('、'), 'warn');
              return false;
            }
            var obj = { __id: 'new-' + Date.now() };
            (spec.cols || []).forEach(function (c) {
              var f = inputs.filter(function (x) { return x.key === c.key; })[0];
              obj[c.key] = f ? f.node.value : (row ? row[c.key] : '');
            });
            if (mode === 'create') { ctx.rows.unshift(obj); }
            else {
              inputs.forEach(function (x) { row[x.key] = x.node.value; });
            }
            if (ctx.table) { ctx.table.setData(ctx.rows); }
            Toast.show(mode === 'create' ? '新增成功，已追加到列表首行' : '保存成功', 'ok');
          }
        }
      ]
    });
  }

  function openDetail(ctx, row) {
    var spec = ctx.spec;
    var box = el('div', {});
    var dl = el('div', { class: 'dl' });
    (spec.cols || []).forEach(function (c) {
      var r = el('div', { class: 'dl-row' });
      r.appendChild(el('span', { class: 'dl-k', text: c.title }));
      var v = row[c.key] === undefined ? '' : row[c.key];
      var vv = el('span', { class: 'dl-v' });
      if (STATUS_KEYS[c.key] || /状态|判定|等级/.test(c.title)) { vv.appendChild(el('span', { class: 'tag ' + tagFor(String(v)), text: v })); }
      else { vv.textContent = v; }
      r.appendChild(vv);
      dl.appendChild(r);
    });
    box.appendChild(dl);
    box.appendChild(el('div', { class: 'form-hint', text: '演示数据：字段来自页面规格定义；正式系统会展示完整单据头/行与关联附件。' }));
    Layers.drawer({
      title: spec.title + ' · 详情',
      width: 520,
      body: box,
      footer: [
        { text: '打印', onClick: function () { openPrint(ctx, row); } },
        { text: '编辑', type: 'primary', onClick: function () { openForm(ctx, row, 'edit'); } },
        { text: '关闭' }
      ]
    });
  }

  function openPrint(ctx, row) {
    var spec = ctx.spec;
    var cols = (spec.cols || []).slice(0, 8);
    var body = '<div style="padding:4px 2px">'
      + '<div style="text-align:center;font-size:17px;font-weight:700;margin-bottom:4px">昇兴股份 · 中山制罐工厂</div>'
      + '<div style="text-align:center;font-size:15px;margin-bottom:12px">' + spec.title + ' 打印预览</div>'
      + '<table style="width:100%;border-collapse:collapse;font-size:12px">'
      + cols.map(function (c) { return '<tr><td style="border:1px solid #e5e6eb;padding:6px 8px;width:32%;background:#fafbfc">' + c.title + '</td><td style="border:1px solid #e5e6eb;padding:6px 8px">' + (row ? (row[c.key] === undefined ? '' : row[c.key]) : '（选中行后打印会带入真实值）') + '</td></tr>'; }).join('')
      + '</table>'
      + '<div style="margin-top:12px;font-size:12px;color:#86909c">制单：苏军辉 ｜ 打印时间：2026-11-18 15:49 ｜ 演示数据</div>'
      + '</div>';
    Layers.modal({
      title: '打印预览',
      width: 720,
      body: body,
      buttons: [
        { text: '关闭' },
        { text: '打印', type: 'primary', onClick: function () { try { window.print(); } catch (e) {} Toast.show('已调用浏览器打印（可在打印对话框中另存为 PDF）', 'ok'); } }
      ]
    });
  }

  function openCurve(ctx, row) {
    var host = el('div', { class: 'chart-host', style: { height: '260px' } });
    var legend = el('div', { class: 'legend' });
    var wrap = el('div', {});
    wrap.appendChild(host);
    wrap.appendChild(legend);
    Layers.drawer({
      title: '采集曲线 · ' + ((row && (row.device || row.matName || row.bill)) || '设备'),
      width: 640,
      body: wrap,
      footer: [{ text: '关闭' }]
    });
    setTimeout(function () {
      var labels = [], vals = [];
      for (var i = 0; i < 24; i++) { labels.push(String(i).padStart(2, '0') + ':00'); vals.push(55 + Math.round(Math.random() * 25)); }
      Chart.render(host, { type: 'line', labels: labels, series: [{ name: '采集值', values: vals }], height: 240 }, legend);
    }, 40);
  }

  function drill(ctx, row) {
    var spec = ctx.spec;
    var cands = LEAVES.filter(function (l) { return l.arch === 'list' && l.module === spec.module && l.id !== spec.id; });
    var target = cands.length ? cands[0] : null;
    if (!target) { openDetail(ctx, row); return; }
    confirmDlg({
      title: '钻取到明细',
      text: '将打开「' + target.name + '」并带入当前汇总条件？',
      onOk: function () {
        Toast.show('已钻取到明细页：' + target.name, 'ok');
        go(target.id);
      }
    });
  }

  function openImport(ctx) {
    var wrap = el('div', {});
    wrap.appendChild(el('div', { class: 'form-hint', text: '选择 CSV/Excel 文件（演示：不真实解析，提交后按文件行数模拟导入）。' }));
    var file = el('input', { type: 'file', accept: '.csv,.xlsx,.xls', class: 'inp' });
    wrap.appendChild(file);
    var ta = el('textarea', { class: 'inp', rows: '5', placeholder: '或在此粘贴数据（每行一条）' });
    ta.style.width = '100%';
    ta.style.marginTop = '8px';
    wrap.appendChild(ta);
    Layers.modal({
      title: '批量导入 · ' + ctx.spec.title,
      width: 640,
      body: wrap,
      buttons: [
        { text: '取消' },
        {
          text: '开始导入', type: 'primary', onClick: function () {
            var n = 0;
            if (file.files && file.files.length) { n = 12; }
            else if (ta.value.trim()) { n = ta.value.trim().split(/\r?\n/).length; }
            if (!n) { Toast.show('请先选择文件或粘贴数据', 'warn'); return false; }
            Toast.show('导入完成：新增 ' + n + ' 行（演示，未做真实校验）', 'ok');
          }
        }
      ]
    });
  }

  function exportCsv(spec, rows, suffix) {
    if (!rows || !rows.length) { Toast.show('没有可导出的数据', 'warn'); return; }
    var cols = (spec.cols || []);
    var headers = cols.map(function (c) { return c.title; });
    var body = rows.map(function (r) { return cols.map(function (c) { return r[c.key] === undefined ? '' : r[c.key]; }); });
    var csv = toCSV(headers, body);
    download((suffix ? spec.title + '-' + suffix : spec.title) + '-' + '20261118.csv', '\ufeff' + csv, 'text/csv;charset=utf-8');
    Toast.show('已导出 ' + rows.length + ' 行 CSV（Excel 可直接打开）', 'ok');
  }

  /* ============================================================
     9. 自检页（验证 332 页全部可渲染、按钮全部有 data-act）
     ============================================================ */
  function renderSelfTest() {
    var view = $('#view');
    clear(view);
    view.appendChild(crumb([{ name: '系统自检' }], '自动化质量闸门'));
    var hd = el('div', { class: 'page-hd' });
    var left = el('div', {});
    left.appendChild(el('h2', {}, [text('原型自检'), el('span', { class: 'pill dot', text: '自动生成' })]));
    left.appendChild(el('div', { class: 'sub', text: '逐页渲染全部菜单页面，检查：规格是否存在、是否渲染成功、按钮总数、带交互标记的按钮数、表格行数。' }));
    hd.appendChild(left);
    view.appendChild(hd);

    var results = [];
    var host = el('div', {});
    var specCount = Object.keys(SPECS).length;
    LEAVES.forEach(function (leaf) {
      var box = el('div', {});
      var rec = { id: leaf.id, name: leaf.name, module: leaf.module, arch: leaf.arch, hasSpec: !!SPECS[leaf.id], ok: false, buttons: 0, acts: 0, rows: 0, err: '' };
      try {
        renderPage(box, leaf);
        rec.ok = true;
        rec.buttons = box.querySelectorAll('button').length;
        rec.acts = box.querySelectorAll('button[data-act]').length;
        rec.core = box.querySelectorAll('button[data-act^="core"]').length;
        rec.rows = box.querySelectorAll('tbody tr').length;
      } catch (e) {
        rec.err = e && e.message ? e.message : String(e);
      }
      results.push(rec);
    });

    var fail = results.filter(function (r) { return !r.ok; });
    var noSpec = results.filter(function (r) { return !r.hasSpec; });
    var noBtn = results.filter(function (r) { return r.ok && r.buttons === 0; });
    var deadBtn = results.filter(function (r) { return r.ok && r.buttons > r.acts; });
    var totalButtons = results.reduce(function (a, r) { return a + r.buttons; }, 0);
    var totalCore = results.reduce(function (a, r) { return a + (r.core || 0); }, 0);

    var kpis = el('div', { class: 'kpi-grid' });
    [
      { label: '菜单页面', value: LEAVES.length, unit: '页' },
      { label: '页面规格', value: specCount, unit: '份' },
      { label: '渲染成功', value: results.length - fail.length, unit: '页', tone: fail.length ? 'danger' : '' },
      { label: '按钮总数', value: totalButtons, unit: '个' },
      { label: '死按钮', value: results.reduce(function (a, r) { return a + (r.buttons - r.acts); }, 0), unit: '个', tone: 'danger' },
      { label: '渲染失败', value: fail.length, unit: '页', tone: fail.length ? 'danger' : '' }
    ].forEach(function (k, i) { kpis.appendChild(kpiCard(k, i)); });
    view.appendChild(kpis);

    var card = el('div', { class: 'card' });
    var chd = el('div', { class: 'card-hd' });
    chd.appendChild(el('span', { class: 'card-title', text: '自检结论' }));
    card.appendChild(chd);
    var cbd = el('div', { class: 'card-bd' });
    [
      ['页面覆盖', specCount === LEAVES.length ? '通过：' + specCount + '/' + LEAVES.length + ' 页都有规格' : '注意：' + (LEAVES.length - specCount) + ' 页缺规格（走兜底渲染）'],
      ['渲染', fail.length === 0 ? '通过：' + results.length + ' 页全部渲染成功' : '失败：' + fail.length + ' 页渲染异常'],
      ['按钮交互', deadBtn.length === 0 ? '通过：' + totalButtons + ' 个按钮全部有交互标记（页面动作 ' + (totalButtons - totalCore) + ' 个 + 组件库内部 ' + totalCore + ' 个）' : '注意：' + deadBtn.length + ' 页存在无交互标记按钮'],
      ['无按钮页面', noBtn.length === 0 ? '通过：每页都有可点按钮' : '注意：' + noBtn.length + ' 页没有按钮']
    ].forEach(function (x) {
      var r = el('div', { class: 'self-row' });
      r.appendChild(el('span', { class: 'self-k', text: x[0] }));
      r.appendChild(el('span', { class: 'self-v ' + (x[1].indexOf('通过') === 0 ? 'ok' : 'warn'), text: x[1] }));
      cbd.appendChild(r);
    });
    card.appendChild(cbd);
    view.appendChild(card);

    if (fail.length) {
      var fc = el('div', { class: 'card' });
      var fhd = el('div', { class: 'card-hd' });
      fhd.appendChild(el('span', { class: 'card-title', text: '渲染失败明细' }));
      fc.appendChild(fhd);
      var fh = el('div', { class: 'tbl-wrap' });
      fc.appendChild(fh);
      createTable(fh, {
        columns: [{ key: 'id', title: '页面编号', w: 110 }, { key: 'name', title: '页面', w: 200 }, { key: 'err', title: '错误', w: 400 }],
        rows: fail, pageSize: 10, rowKey: function (r) { return r.id; }
      });
      view.appendChild(fc);
    }

    var tc = el('div', { class: 'card' });
    var thd = el('div', { class: 'card-hd' });
    thd.appendChild(el('span', { class: 'card-title', text: '逐页明细（' + results.length + ' 页）' }));
    var thr = el('div', { class: 'card-hd-r' });
    var bExp = btn('导出自检报告 CSV', 'default', 'selftest-export', { sm: true, icon: 'download' });
    bExp.addEventListener('click', function () { exportCsv({ title: '原型自检报告', cols: [{ key: 'id', title: '页面编号' }, { key: 'name', title: '页面名称' }, { key: 'module', title: '模块' }, { key: 'arch', title: '模板' }, { key: 'hasSpec', title: '有规格' }, { key: 'ok', title: '渲染成功' }, { key: 'buttons', title: '按钮数' }, { key: 'acts', title: '带交互' }, { key: 'rows', title: '表格行数' }] }, results); });
    thr.appendChild(bExp);
    thd.appendChild(thr);
    tc.appendChild(thd);
    var thost = el('div', { class: 'tbl-wrap' });
    tc.appendChild(thost);
    view.appendChild(tc);
    createTable(thost, {
      columns: [
        { key: 'id', title: '页面编号', w: 100, sort: true },
        { key: 'name', title: '页面名称', w: 190, sort: true },
        { key: 'module', title: '模块', w: 110, sort: true, filter: true },
        { key: 'arch', title: '模板', w: 100, sort: true, filter: true },
        { key: 'hasSpec', title: '有规格', w: 90, type: 'tag' },
        { key: 'ok', title: '渲染', w: 90, type: 'tag' },
        { key: 'buttons', title: '按钮数', w: 90, type: 'num', sort: true },
        { key: 'acts', title: '带交互', w: 90, type: 'num', sort: true },
        { key: 'rows', title: '表格行', w: 90, type: 'num', sort: true }
      ],
      rows: results, pageSize: 20, rowKey: function (r) { return r.id; }
    });
    view.appendChild(el('div', { class: 'demo-note', text: '自检为浏览器内实时执行，结果可导出 CSV 作为交付证据。' }));
  }

  /* ============================================================
     10. 启动
     ============================================================ */
  function boot() {
    bindTopbar();
    restoreTabs();
    if (!location.hash) { location.hash = '#/home'; }
    render();
    window.addEventListener('hashchange', function () { render(); });
    document.addEventListener('keydown', guard(function (e) {
      if (e.key === 'F5') { return; }
      if (e.key === 'Escape') { return; }
      if (e.ctrlKey && e.key === 'k') { e.preventDefault(); var i = $('.nav-search input'); if (i) { i.focus(); } }
    }));
  }

  window.MOMPROTO = {
    go: go,
    render: render,
    leaves: LEAVES,
    specs: SPECS,
    specOf: function (id) { return LEAF[id] ? specOf(LEAF[id]) : null; },
    leafOf: function (id) { return LEAF[id] || null; },
    menu: function () { return MENU; }
  };

  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', boot); }
  else { boot(); }
})();

</script>
</body>
</html>
