<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设备管理系统 · 昇兴三片罐MOM</title>
  <style>
/* ============ 基础 ============ */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root{
  --navy:#1f2d3d; --navy2:#233449; --navy3:#2c3d54;
  --primary:#1890ff; --primary2:#337aff; --blue:#1f6fe0;
  --bg:#f0f2f5; --card:#fff; --line:#e8e8e8; --line2:#f0f0f0;
  --text:#303133; --sub:#606266; --muted:#909399;
  --green:#52c41a; --orange:#fa8c16; --red:#f5222d;
  --radius:4px;
}
html,body{ height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:var(--text); font-size:14px; }
body{ background:var(--bg); overflow:hidden; }
.hidden{ display:none !important; }
svg{ fill:currentColor; }
button{ font-family:inherit; cursor:pointer; }
input,select{ font-family:inherit; outline:none; }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:#c8cdd4; border-radius:4px; }
::-webkit-scrollbar-track{ background:transparent; }

/* ============ 登录页 ============ */
.login-page{ position:fixed; inset:0; z-index:1000; overflow:hidden; }
.login-bg{ position:absolute; inset:0; }
.login-svg{ width:100%; height:100%; display:block; }
.login-top{ position:absolute; top:0; left:0; right:0; padding:26px 46px; display:flex; justify-content:space-between; align-items:center; color:#fff; }
.brand{ display:flex; align-items:center; gap:10px; }
.brand-txt{ display:flex; flex-direction:column; line-height:1.1; }
.brand-txt b{ font-size:20px; letter-spacing:2px; }
.brand-txt span{ font-size:9px; letter-spacing:2px; opacity:.85; }
.slogan{ font-size:14px; letter-spacing:3px; opacity:.9; }
.login-center{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:360px; }
.login-title{ display:flex; align-items:center; justify-content:center; gap:9px; color:#fff; font-size:17px; font-weight:600; margin-bottom:18px; text-shadow:0 1px 8px rgba(0,0,0,.3); }
.login-logo{ width:22px; height:22px; background:#e1251b; border-radius:3px; display:inline-flex; align-items:center; justify-content:center; font-size:13px; }
.login-card{ background:rgba(255,255,255,.96); border-radius:6px; padding:26px 26px 18px; box-shadow:0 12px 40px rgba(0,20,60,.35); }
.field{ display:flex; align-items:center; height:42px; border:1px solid #d9dfe8; border-radius:4px; margin-bottom:14px; background:#fff; overflow:hidden; }
.field:focus-within{ border-color:#3d8bff; box-shadow:0 0 0 2px rgba(61,139,255,.15); }
.field .fi{ width:42px; display:flex; align-items:center; justify-content:center; color:#9aa7b8; }
.field .fi svg{ width:17px; height:17px; }
.field input,.field select{ flex:1; border:none; height:100%; font-size:14px; color:var(--text); background:transparent; }
.field input::placeholder{ color:#b5bdc9; }
.field select{ color:#606266; cursor:pointer; }
.login-btn{ width:100%; height:42px; border:none; border-radius:4px; background:linear-gradient(90deg,#1f6fe0,#1f7bf0); color:#fff; font-size:15px; letter-spacing:4px; margin-top:4px; transition:.2s; }
.login-btn:hover{ background:linear-gradient(90deg,#1a63cf,#1f6fe0); }
.login-lang{ display:flex; align-items:center; justify-content:flex-end; gap:4px; color:#909399; font-size:12px; margin-top:14px; }
.login-foot{ position:absolute; bottom:18px; left:0; right:0; text-align:center; color:rgba(255,255,255,.75); font-size:12px; letter-spacing:2px; }

/* ============ 应用骨架 ============ */
.app{ position:fixed; inset:0; display:flex; flex-direction:column; }
.topbar{ height:48px; background:#152238; color:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 16px; flex-shrink:0; box-shadow:0 1px 4px rgba(0,0,0,.2); z-index:20; }
.top-left,.top-right{ display:flex; align-items:center; gap:14px; min-width:280px; }
.top-right{ justify-content:flex-end; }
.top-brand{ display:flex; align-items:center; gap:7px; font-size:13px; }
.top-org{ font-size:12px; color:#c8d4e4; }
.top-title{ font-size:17px; font-weight:600; letter-spacing:1px; }
.hello{ font-size:12px; color:#dbe4f0; }
.top-ico{ position:relative; width:22px; height:22px; cursor:pointer; color:#dbe4f0; }
.top-ico svg{ width:18px; height:18px; }
.top-ico .dot{ position:absolute; top:-1px; right:-2px; width:7px; height:7px; background:#f5222d; border-radius:50%; border:1px solid #152238; }
.top-avatar{ width:28px; height:28px; border-radius:50%; background:#337aff; display:flex; align-items:center; justify-content:center; font-size:13px; cursor:pointer; }
.body-wrap{ flex:1; display:flex; min-height:0; }

/* 侧边栏 */
.sidebar{ width:210px; background:var(--navy); color:#c8d4e4; display:flex; flex-direction:column; flex-shrink:0; position:relative; transition:width .2s; overflow:hidden; }
.sidebar.collapsed{ width:50px; }
.side-collapse{ position:absolute; top:0; right:0; width:24px; height:100%; cursor:pointer; z-index:5; display:flex; align-items:center; }
.side-collapse svg{ width:14px; height:14px; color:#7d8ba0; }
.menu-tree{ flex:1; overflow-y:auto; overflow-x:hidden; padding-top:8px; }
.menu-tree::-webkit-scrollbar{ width:0; }
.menu-group{ }
.menu-parent{ height:40px; display:flex; align-items:center; gap:10px; padding:0 14px 0 18px; cursor:pointer; font-size:13px; color:#cbd6e4; user-select:none; white-space:nowrap; border-left:3px solid transparent; }
.menu-parent:hover{ background:var(--navy2); }
.menu-parent .mi{ width:16px; height:16px; flex-shrink:0; opacity:.9; }
.menu-parent .mtxt{ flex:1; }
.menu-parent .arrow{ width:9px; height:9px; transition:transform .2s; opacity:.6; }
.menu-parent.open .arrow{ transform:rotate(90deg); }
.menu-parent.active{ background:#182234; border-left-color:var(--primary); color:#fff; }
.menu-children{ overflow:hidden; background:#182234; }
.menu-child{ height:36px; display:flex; align-items:center; padding:0 12px 0 44px; cursor:pointer; font-size:12.5px; color:#9fb0c6; white-space:nowrap; border-left:3px solid transparent; }
.menu-child:hover{ background:var(--navy2); color:#fff; }
.menu-child.active{ background:var(--primary); color:#fff; }
.menu-child .cdot{ width:5px; height:5px; border-radius:50%; background:#6b7d96; margin-right:9px; flex-shrink:0; }
.menu-child.active .cdot{ background:#fff; }
.sidebar.collapsed .menu-parent{ padding-left:16px; }
.sidebar.collapsed .menu-parent .mtxt,.sidebar.collapsed .menu-parent .arrow,.sidebar.collapsed .menu-children,.sidebar.collapsed .side-foot{ display:none; }
.side-foot{ text-align:center; font-size:11px; color:#5c6b80; padding:10px 0; }

/* 主内容 */
.main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.tabs-bar{ height:36px; background:#fff; display:flex; align-items:stretch; border-bottom:1px solid #e0e4ea; flex-shrink:0; overflow-x:auto; overflow-y:hidden; }
.tabs-bar::-webkit-scrollbar{ height:0; }
.tab{ display:flex; align-items:center; gap:6px; padding:0 12px 0 14px; font-size:12.5px; color:#606266; cursor:pointer; border-right:1px solid #eee; white-space:nowrap; position:relative; }
.tab:hover{ background:#f7f9fc; }
.tab.active{ color:var(--primary); background:#fff; }
.tab.active::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--primary); }
.tab .tclose{ font-size:15px; color:#aab; line-height:1; margin-left:4px; }
.tab .tclose:hover{ color:#f5222d; }
.content{ flex:1; overflow:auto; padding:14px; background:var(--bg); }

/* ============ 通用组件 ============ */
.card{ background:var(--card); border-radius:var(--radius); box-shadow:0 1px 3px rgba(0,0,0,.06); margin-bottom:14px; }
.card-head{ padding:12px 16px; border-bottom:1px solid var(--line2); display:flex; align-items:center; justify-content:space-between; }
.card-head h3{ font-size:14px; font-weight:600; display:flex; align-items:center; gap:7px; }
.card-head h3::before{ content:""; width:3px; height:14px; background:var(--primary); border-radius:2px; }
.card-body{ padding:14px 16px; }
.panel-title{ font-size:14px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:7px; }
.panel-title::before{ content:""; width:3px; height:14px; background:var(--primary); border-radius:2px; }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:5px; height:30px; padding:0 13px; border:1px solid #dcdfe6; background:#fff; color:#606266; border-radius:3px; font-size:12.5px; transition:.15s; white-space:nowrap; }
.btn:hover{ border-color:var(--primary); color:var(--primary); }
.btn-primary{ background:var(--primary); border-color:var(--primary); color:#fff; }
.btn-primary:hover{ background:#0f7ff0; border-color:#0f7ff0; color:#fff; }
.btn-danger{ color:#f5222d; border-color:#ffccc7; }
.btn-danger:hover{ background:#fff2f0; border-color:#f5222d; color:#f5222d; }
.btn-sm{ height:26px; padding:0 10px; font-size:12px; }
.btn-text{ border:none; background:transparent; color:var(--primary); padding:0 5px; height:auto; }
.btn-text:hover{ color:#0f7ff0; }
.btn-text.red{ color:#f5222d; }

/* 搜索表单 */
.search-form{ padding:14px 16px 4px; }
.search-row{ display:flex; flex-wrap:wrap; gap:12px 24px; align-items:flex-end; }
.form-item{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.form-item > label{ font-size:12.5px; color:#606266; white-space:nowrap; }
.form-item .control,.form-item input,.form-item select{ height:30px; border:1px solid #dcdfe6; border-radius:3px; padding:0 9px; font-size:12.5px; color:var(--text); background:#fff; min-width:160px; }
.form-item input:focus,.form-item select:focus{ border-color:var(--primary); }
.form-item input::placeholder{ color:#c0c4cc; }
.input-group{ display:flex; align-items:center; }
.input-group select{ height:30px; border:1px solid #dcdfe6; border-right:none; border-radius:3px 0 0 3px; padding:0 6px; font-size:12.5px; color:#606266; background:#f7f8fa; }
.input-group input{ border-radius:0 3px 3px 0; }
.search-actions{ display:flex; gap:8px; justify-content:flex-end; padding:0 16px 14px; }
.search-actions .btn{ min-width:70px; }

/* 工具条 */
.toolbar{ display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--line2); flex-wrap:wrap; }
.toolbar .spacer{ flex:1; }
.toolbar .search-mini{ display:flex; align-items:center; border:1px solid #dcdfe6; border-radius:3px; height:30px; overflow:hidden; }
.toolbar .search-mini input{ border:none; height:28px; padding:0 9px; width:160px; font-size:12.5px; }
.toolbar .search-mini button{ border:none; background:var(--primary); color:#fff; height:30px; padding:0 12px; }

/* 表格 */
.table-wrap{ overflow:auto; }
table.grid{ width:100%; border-collapse:collapse; font-size:12.5px; }
table.grid th{ background:#fafafa; color:#5a6572; font-weight:600; text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
table.grid th.sortable::after{ content:"⇅"; margin-left:5px; color:#c0c4cc; font-size:11px; }
table.grid td{ padding:8px 10px; border-bottom:1px solid #f0f0f0; color:#515a6e; white-space:nowrap; }
table.grid tr:hover td{ background:#f5faff; }
table.grid tr.selected td{ background:#e6f4ff; }
table.grid .cbx{ width:14px; height:14px; accent-color:var(--primary); cursor:pointer; }
.link{ color:var(--primary); cursor:pointer; }
.link:hover{ text-decoration:underline; }
.link.red{ color:#f5222d; }
.tag{ display:inline-block; padding:1px 8px; border-radius:3px; font-size:12px; line-height:19px; }
.tag-orange{ background:#fff3e0; color:#fa8c16; border:1px solid #ffd8a8; }
.tag-green{ background:#f0fdf4; color:#389e0d; border:1px solid #b7eb8f; }
.tag-blue{ background:#e6f4ff; color:#1890ff; border:1px solid #91caff; }
.tag-red{ background:#fff1f0; color:#f5222d; border:1px solid #ffa39e; }
.tag-gray{ background:#f5f5f5; color:#8c8c8c; border:1px solid #d9d9d9; }
.pagination{ display:flex; align-items:center; justify-content:flex-end; gap:6px; padding:12px 16px; font-size:12.5px; color:#606266; }
.pg-btn{ min-width:28px; height:28px; border:1px solid #dcdfe6; background:#fff; border-radius:3px; color:#606266; display:inline-flex; align-items:center; justify-content:center; padding:0 7px; }
.pg-btn:hover{ border-color:var(--primary); color:var(--primary); }
.pg-btn.active{ background:var(--primary); border-color:var(--primary); color:#fff; }
.pg-btn.disabled{ opacity:.5; cursor:not-allowed; }
.pg-total{ margin-right:auto; color:#909399; }

/* 统计卡片 */
.stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:14px; }
.stat-card{ background:#fff; border-radius:var(--radius); padding:16px 18px; box-shadow:0 1px 3px rgba(0,0,0,.06); display:flex; align-items:center; gap:14px; }
.stat-card .sicon{ width:46px; height:46px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; }
.stat-card .sicon svg{ width:24px; height:24px; }
.stat-card .sinfo{ min-width:0; }
.stat-card .snum{ font-size:24px; font-weight:700; line-height:1.1; color:#1f2d3d; }
.stat-card .slabel{ font-size:12px; color:#909399; margin-top:5px; }
.stat-card .strend{ font-size:11px; margin-top:3px; }
.up{ color:#f5222d; } .down{ color:#52c41a; }

/* 图表 */
.chart-row{ display:flex; gap:14px; margin-bottom:14px; }
.chart-box{ background:#fff; border-radius:var(--radius); box-shadow:0 1px 3px rgba(0,0,0,.06); padding:14px 16px; }
.chart-box h4{ font-size:13px; font-weight:600; margin-bottom:4px; display:flex; align-items:center; gap:6px; }
.chart-box h4::before{ content:""; width:3px; height:13px; background:var(--primary); border-radius:2px; }
.chart-sub{ font-size:11px; color:#909399; margin-bottom:8px; }
.chart-svg{ width:100%; display:block; }
.legend{ display:flex; flex-wrap:wrap; gap:10px 18px; font-size:12px; color:#606266; margin-top:8px; }
.legend .li{ display:flex; align-items:center; gap:6px; }
.legend .lc{ width:10px; height:10px; border-radius:2px; }

/* 两栏布局 */
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.col-38{ display:grid; grid-template-columns:38% 1fr; gap:14px; }
.col-62{ display:grid; grid-template-columns:1fr 62%; gap:14px; }

/* 抽屉 / 弹窗 */
.drawer-mask,.modal-mask{ position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:100; }
.drawer{ position:fixed; right:0; top:0; bottom:0; width:380px; background:#fff; z-index:101; display:flex; flex-direction:column; box-shadow:-2px 0 12px rgba(0,0,0,.15); }
.drawer-head{ height:42px; background:#1f2d3d; color:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 14px; font-size:14px; }
.drawer-head span{ cursor:pointer; font-size:20px; line-height:1; }
.drawer-tabs{ display:flex; border-bottom:1px solid var(--line); padding:0 14px; gap:20px; height:38px; align-items:center; }
.drawer-tabs span{ font-size:12.5px; color:#606266; cursor:pointer; height:38px; display:flex; align-items:center; border-bottom:2px solid transparent; }
.drawer-tabs span.active{ color:var(--primary); border-bottom-color:var(--primary); }
.drawer-body{ flex:1; overflow:auto; padding:12px 14px; }
.msg-item{ border-bottom:1px solid var(--line2); padding:10px 0; }
.msg-item .mt{ font-size:13px; font-weight:600; color:#303133; margin-bottom:4px; }
.msg-item .md{ font-size:12px; color:#909399; line-height:1.6; }
.msg-item .md a{ color:var(--primary); }
.msg-item .mtime{ font-size:11px; color:#c0c4cc; text-align:right; margin-top:4px; }
.drawer-foot{ height:44px; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:center; gap:30px; color:var(--primary); font-size:12.5px; cursor:pointer; }
.modal-mask{ display:flex; align-items:center; justify-content:center; z-index:200; }
.modal{ width:560px; max-width:92vw; max-height:86vh; background:#fff; border-radius:5px; display:flex; flex-direction:column; box-shadow:0 8px 30px rgba(0,0,0,.2); }
.modal.wide{ width:820px; }
.modal-head{ height:44px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:0 16px; font-size:14px; }
.modal-head span{ font-size:20px; cursor:pointer; color:#909399; }
.modal-body{ padding:18px 20px; overflow:auto; }
.modal-foot{ padding:12px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; }
.mform-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px 18px; }
.mform-item{ display:flex; flex-direction:column; gap:5px; }
.mform-item label{ font-size:12.5px; color:#606266; }
.mform-item label .req{ color:#f5222d; }
.mform-item input,.mform-item select,.mform-item textarea{ height:32px; border:1px solid #dcdfe6; border-radius:3px; padding:0 9px; font-size:13px; color:var(--text); }
.mform-item textarea{ height:70px; padding:8px 9px; resize:vertical; }
.mform-item input:focus,.mform-item select:focus,.mform-item textarea:focus{ border-color:var(--primary); }
.mform-full{ grid-column:1/-1; }

.toast{ position:fixed; top:60px; left:50%; transform:translateX(-50%); background:#fff; border:1px solid #e0e4ea; box-shadow:0 4px 16px rgba(0,0,0,.12); padding:11px 20px; border-radius:4px; font-size:13px; z-index:500; display:flex; align-items:center; gap:8px; }
.toast::before{ content:"✓"; color:var(--green); font-weight:700; }
.toast.err::before{ content:"!"; color:var(--red); }

/* 详情页 */
.detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 24px; }
.detail-item{ display:flex; padding:9px 0; border-bottom:1px dashed var(--line); font-size:13px; }
.detail-item .dk{ width:110px; color:#909399; flex-shrink:0; }
.detail-item .dv{ color:#303133; }

/* 进度条 */
.progress{ width:100%; height:8px; background:#f0f0f0; border-radius:4px; overflow:hidden; }
.progress > i{ display:block; height:100%; background:var(--primary); border-radius:4px; }

@media (max-width:1100px){
  .stat-grid{ grid-template-columns:repeat(2,1fr); }
  .col-38,.col-62,.two-col{ grid-template-columns:1fr; }
}

/* ============ 新增：真实系统搜索/表格布局 ============ */
/* 搜索区栅格 */
.search-form2{ padding:14px 16px 6px; }
.sf-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px 22px; }
.sf-item{ display:flex; align-items:center; gap:8px; min-width:0; }
.sf-item > label{ font-size:12.5px; color:#606266; width:82px; text-align:right; flex-shrink:0; white-space:nowrap; }
.sf-item > select{ flex:1; min-width:0; height:30px; border:1px solid #dcdfe6; border-radius:3px; padding:0 8px; font-size:12.5px; color:#606266; background:#fff; }
.sf-ctrl{ display:flex; flex:1; min-width:0; height:30px; }
.sf-ctrl .op-sel{ height:30px; width:78px; flex-shrink:0; border:1px solid #dcdfe6; border-right:none; border-radius:3px 0 0 3px; padding:0 4px; font-size:12px; color:#606266; background:#f7f8fa; }
.sf-ctrl input{ flex:1; min-width:0; height:30px; border:1px solid #dcdfe6; border-radius:0 3px 3px 0; padding:0 8px; font-size:12.5px; color:#303133; }
.sf-ctrl input:focus,.sf-item > select:focus{ border-color:#1890ff; }
/* 日期快捷：内容较宽（5个快捷按钮+起止日期），独占整行避免与相邻字段重叠 */
.sf-date{ display:flex; align-items:center; gap:8px; grid-column:1 / -1; min-width:0; flex-wrap:wrap; }
.sf-date > label{ font-size:12.5px; color:#606266; width:82px; text-align:right; flex-shrink:0; white-space:nowrap; }
.date-quick{ display:flex; flex-shrink:0; }
.date-quick span{ font-size:12px; color:#606266; padding:0 7px; height:30px; line-height:30px; cursor:pointer; border:1px solid #dcdfe6; border-right:none; }
.date-quick span:first-child{ border-radius:3px 0 0 3px; }
.date-quick span:last-child{ border-right:1px solid #dcdfe6; border-radius:0 3px 3px 0; }
.date-quick span.sel{ background:#e6f4ff; color:#1890ff; border-color:#1890ff; }
.date-range{ display:flex; align-items:center; gap:4px; min-width:0; }
.date-range input{ width:104px; height:30px; border:1px solid #dcdfe6; border-radius:3px; padding:0 6px; font-size:12px; }
.date-range span{ color:#c0c4cc; }
/* radio 选项 */
.sf-radio{ grid-column:span 1; }
.radio-opts{ display:flex; flex-wrap:wrap; gap:0; flex:1; }
.radio-opts span{ font-size:12px; color:#606266; padding:0 9px; height:30px; line-height:30px; cursor:pointer; border:1px solid #dcdfe6; border-right:none; }
.radio-opts span:first-child{ border-radius:3px 0 0 3px; }
.radio-opts span:last-child{ border-right:1px solid #dcdfe6; border-radius:0 3px 3px 0; }
.radio-opts span.sel{ background:#e6f4ff; color:#1890ff; border-color:#1890ff; }
.sf-actions{ display:flex; justify-content:flex-end; gap:8px; padding:10px 0 4px; }
.sf-actions .btn{ min-width:60px; }

.toolbar2{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 16px; border-bottom:1px solid var(--line2); flex-wrap:wrap; }
.tb-left{ display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
.toolbar2 .btn{ height:28px; font-size:12px; padding:0 10px; }
/* 统计条 */
.stat-strip{ display:flex; gap:0; border-bottom:1px solid var(--line2); background:#fafcff; }
.ss-item{ flex:1; display:flex; flex-direction:column; align-items:center; padding:9px 6px; border-right:1px solid #eef1f5; }

.ss-item span{ font-size:11.5px; color:#909399; }
.ss-item b{ font-size:17px; color:#1f2d3d; margin-top:2px; }
/* 子标签页 */
.subtabs{ display:flex; gap:0; border-bottom:1px solid var(--line); padding:0 16px; background:#fff; }
.subtabs span{ font-size:12.5px; color:#606266; padding:9px 16px; cursor:pointer; border-bottom:2px solid transparent; }
.subtabs span.active{ color:#1890ff; border-bottom-color:#1890ff; }
.subtabs + .table-wrap table.grid th{ background:#f7f9fc; }
@media(max-width:1200px){
  .sf-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); }
}

/* ============ 真实系统表单：分组Tab + 类型化控件 ============ */
.modal.xwide{ width:900px; }
.real-form .form-tabs{ display:flex; gap:0; border-bottom:1px solid var(--line); margin:-18px -20px 16px; padding:0 20px; }
.real-form .form-tabs span{ font-size:13px; color:#606266; padding:11px 18px; cursor:pointer; border-bottom:2px solid transparent; }
.real-form .form-tabs span.active{ color:var(--primary); border-bottom-color:var(--primary); font-weight:600; }
.fform-grid{ display:grid; grid-template-columns:1fr 1fr; gap:15px 22px; }
.fform-item{ display:flex; align-items:flex-start; gap:10px; min-width:0; }
.fform-item > label{ width:96px; text-align:right; flex-shrink:0; font-size:12.5px; color:#606266; line-height:32px; white-space:nowrap; }
.fform-item > label .req{ color:#f5222d; font-style:normal; margin-right:3px; }
.fform-ctrl{ flex:1; min-width:0; }
.fform-ctrl input,.fform-ctrl select,.fform-ctrl textarea{ width:100%; height:32px; border:1px solid #dcdfe6; border-radius:3px; padding:0 9px; font-size:12.5px; color:#303133; background:#fff; }
.fform-ctrl select{ appearance:none; background:#fff url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23a0a8b5' fill='none'/%3E%3C/svg%3E") no-repeat right 9px center; padding-right:24px; }
.fform-ctrl textarea{ height:64px; padding:7px 9px; resize:vertical; }
.fform-ctrl input:focus,.fform-ctrl select:focus,.fform-ctrl textarea:focus{ border-color:var(--primary); outline:none; }
.fform-ctrl input[readonly],.fform-ctrl textarea[readonly],.fform-ctrl select:disabled{ background:#f7f8fa; color:#606266; cursor:default; }
.fform-ctrl input.fdate::after{ content:''; }
.fform-full{ grid-column:1 / -1; }
.fform-full .fform-ctrl textarea{ height:72px; }
/* 图片上传 */
.f-upload{ display:flex; gap:14px; align-items:flex-start; }
.f-up-btn{ width:84px; height:84px; border:1px dashed #c8cdd6; border-radius:4px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#8a94a3; cursor:pointer; background:#fafcff; font-size:24px; flex-shrink:0; }
.f-up-btn:hover{ border-color:var(--primary); color:var(--primary); }

/* ---------- SVG 图表 ---------- */
const PALETTE=['#5470c6','#91cc75','#fac858','#ee6666','#73c0de','#3ba272','#fc8452','#9a60b4'];
function pieChart(data, size=190){
  const total=data.reduce((s,d)=>s+d.value,0)||1, cx=size/2, cy=size/2, r=size/2-8, ir=r*0.55;
  let a0=-Math.PI/2, paths='';
  data.forEach((d,i)=>{
    const a1=a0+(d.value/total)*Math.PI*2, large=(a1-a0)>Math.PI?1:0;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const xi1=cx+ir*Math.cos(a1),yi1=cy+ir*Math.sin(a1),xi0=cx+ir*Math.cos(a0),yi0=cy+ir*Math.sin(a0);
    paths+=`<path d="M${x0} ${y0} A${r} ${r} 0 ${large} 1 ${x1} ${y1} L${xi1} ${yi1} A${ir} ${ir} 0 ${large} 0 ${xi0} ${yi0} Z" fill="${d.color||PALETTE[i%PALETTE.length]}"/>`;
    a0=a1;
  });
  return `<svg class="chart-svg" viewBox="0 0 ${size} ${size}" style="max-width:${size}px;margin:0 auto">${paths}
    <text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="13" fill="#303133" font-weight="700">${total}</text>
    <text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="11" fill="#909399">设备总数</text></svg>`;
}
function barChart(data, opt={}){
  const w=opt.w||680,h=opt.h||230,pad={l:36,r:12,t:16,b:30},iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
  const max=Math.max(...data.map(d=>d.value),1),step=iw/data.length,bw=Math.min(step*0.55,36);
  let g='';
  for(let i=0;i<=4;i++){const y=pad.t+ih*(i/4);g+=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="#eef0f3"/><text x="${pad.l-7}" y="${y+4}" text-anchor="end" font-size="10" fill="#a0a8b5">${Math.round(max*(4-i)/4)}</text>`;}
  data.forEach((d,i)=>{
    const bh=(d.value/max)*ih,x=pad.l+step*i+(step-bw)/2,y=pad.t+ih-bh;
    g+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="${d.color||'#5470c6'}" rx="2"><title>${esc(d.name)}: ${d.value}</title></rect>`;
    g+=`<text x="${pad.l+step*i+step/2}" y="${h-9}" text-anchor="middle" font-size="9.5" fill="#8a94a3">${esc(d.name)}</text>`;
  });
  return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}">${g}</svg>`;
}
function lineChart(series, labels, opt={}){
  const w=opt.w||680,h=opt.h||250,pad={l:40,r:14,t:18,b:28},iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
  const all=series.flatMap(s=>s.data),max=Math.max(...all,1);
  let g='';
  for(let i=0;i<=4;i++){const y=pad.t+ih*(i/4);g+=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="#eef0f3"/><text x="${pad.l-7}" y="${y+4}" text-anchor="end" font-size="10" fill="#a0a8b5">${Math.round(max*(4-i)/4)}</text>`;}
  labels.forEach((l,i)=>{const x=pad.l+iw*(labels.length===1?0:i/(labels.length-1));g+=`<text x="${x}" y="${h-8}" text-anchor="middle" font-size="9" fill="#8a94a3">${esc(l)}</text>`;});
  series.forEach((s,si)=>{
    const pts=s.data.map((v,i)=>[pad.l+iw*(labels.length===1?0:i/(labels.length-1)),pad.t+ih-(v/max)*ih]);
    g+=`<path d="${pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ')}" fill="none" stroke="${s.color||PALETTE[si]}" stroke-width="2"/>`;
    pts.forEach(p=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#fff" stroke="${s.color||PALETTE[si]}" stroke-width="2"/>`);
  });
  return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}">${g}</svg>`;
}
function statCard(label,val,color,icon){
  const paths={'M3:device':'<path d="M4 4h16v12H4V4zm2 2v8h12V6H6zM9 20h6v-4H9v4z"/>',
    'M3:check':'<path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>',
    'M3:tool':'<path d="M22 5.7 18.3 2 12 8.3 5.7 2 2 5.7 8.3 12 2 18.3 5.7 22 12 15.7 18.3 22 22 18.3 15.7 12 22 5.7z"/>',
    'M3:chart':'<path d="M4 20h16v-2H4v2zM6 16h3V8H6v8zm5 0h3V4h-3v12zm5 0h3v-6h-3v6z"/>',
    'M3:clock':'<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 11h-3V6h2v5h4v2h-3z"/>'};
  return `<div class="stat-card"><div class="sicon" style="background:${color}"><svg viewBox="0 0 24 24">${paths[icon]||paths['M3:chart']}</svg></div><div class="sinfo"><div class="snum">${val}</div><div class="slabel">${label}</div></div></div>`;
}

/* ---------- 搜索表单渲染（真实系统：标签 + 包含下拉 + 输入，栅格排列） ---------- */
function renderSearchField(f, st){
  if(f.type==='date'){
    return `<div class="sf-date"><label>${esc(f.label)}</label><div class="date-quick">${['今天','本周','本月','最近三个月','自定义'].map(x=>`<span class="${st['_q_'+f.label]===x?'sel':''}" onclick="App.setQuick('${f.label}','${x}')">${x}</span>`).join('')}</div>
      <div class="date-range"><input placeholder="开始日期" value="${esc(st['_ds_'+f.label]||'')}"><span>~</span><input placeholder="结束日期" value="${esc(st['_de_'+f.label]||'')}"></div></div>`;
  }
  if(f.type==='radio'){
    return `<div class="sf-item sf-radio"><label>${esc(f.label)}</label><div class="radio-opts">${['ALL',...(f.opts||[])].map((o,i)=>`<span class="${(st[f.key]||'ALL')===o?'sel':''}" onclick="App.setRadio('${f.key}','${o}')">${o==='ALL'?'ALL':o}</span>`).join('')}</div></div>`;
  }
  if(f.type==='select'){
    return `<div class="sf-item"><label>${esc(f.label)}</label><select data-filter="${f.key}">${(f.opts||[]).map(o=>`<option value="${esc(o)}" ${st[f.key]===o?'selected':''}>${esc(o||'请选择')}</option>`).join('')}</select></div>`;
  }
  // OP: 包含下拉 + 输入 / 普通输入
  const opKey='_op_'+f.key;
  const selOpts=(f.opts&&f.opts.length)?f.opts:['包含','不包含','等于'];
  return `<div class="sf-item"><label>${esc(f.label)}</label>
    <div class="sf-ctrl"><select class="op-sel" data-op="${opKey}">${selOpts.map(o=>`<option ${st[opKey]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>
    <input type="text" data-filter="${f.key}" placeholder="${selOpts[0]==='请选择'?'请选择':'请输入'}" value="${esc(st[f.key]||'')}"></div></div>`;
}

function renderTable(cfg, id){
  const st=App.filters[id]||(App.filters[id]={});

  (cfg.search||[]).forEach(f=>{
    if(!f.key) return;

  });
  if(st._kw){const k=st._kw.toLowerCase();data=data.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(k)));}
  const total=cfg.total!=null?cfg.total:data.length, ps=cfg.pageSize||10;
  const page=st._page||1, pages=Math.max(1,Math.ceil((data.length||1)/ps));

      {name:'三季度',value:Math.round(cfg.data.slice(6,9).reduce((a,b)=>a+b,0)/3)},
      {name:'四季度',value:Math.round(cfg.data.slice(9,12).reduce((a,b)=>a+b,0)/3)}],{h:220})}</div>`;
}

/* ---------- 页面获取 ---------- */
function genericPage(id){
  return {type:'table',title:NAME_MAP[id]||id,dataset:[],pageSize:10,
    search:[SEL('组织机构','org',[ORG])],cols:[COL('','_cb',{cb:true}),COL('编码','code'),COL('名称','name'),COL('操作','_op')],actions:[],buttons:[]};
}
function getPage(id){
  if(PAGES[id]) return PAGES[id];
  if(id==='board') return {type:'dashboard',title:'设备管理看板'};
  if(id==='mttr'||id==='mtbf') return {type:'chart',title:NAME_MAP[id]};
  return genericPage(id);
}
/* ============================================================
 *  App 控制器
 * ============================================================ */
const App={
  tabs:[{id:'home',title:'首页'}], current:'home', filters:{}, sortState:{}, openGroups:new Set(),

  init(){
    document.getElementById('loginBtn').addEventListener('click',()=>this.login());
    document.getElementById('loginPwd').addEventListener('keydown',e=>{if(e.key==='Enter')this.login();});
    this.renderMenu(); this.renderTabs(); this.renderMessages();
  },
  login(){
    const u=document.getElementById('loginUser').value.trim(), p=document.getElementById('loginPwd').value.trim();
    if(!u||!p){this.toast('请输入用户名和密码',true);return;}
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('topOrg').textContent='【'+(document.getElementById('loginOrg').value||ORG)+'】';
    this.go('home'); this.toast('登录成功，欢迎回来！');
  },
  logout(){document.getElementById('app').classList.add('hidden');document.getElementById('loginPage').classList.remove('hidden');},

  renderMenu(){
    document.getElementById('menuTree').innerHTML=MENU.map(g=>`
      <div class="menu-group">
        <div class="menu-parent ${this.openGroups.has(g.id)?'open':''}" data-group="${g.id}" onclick="App.toggleGroup('${g.id}')">
          <span class="mi">${ICONS[g.icon]}</span><span class="mtxt">${g.name}</span><span class="arrow">${ICONS.chevron}</span></div>
        <div class="menu-children" id="children-${g.id}" style="${this.openGroups.has(g.id)?'':'display:none'}">
          ${g.children.map(c=>`<div class="menu-child" data-id="${c.id}" onclick="App.go('${c.id}')"><span class="cdot"></span>${c.name}</div>`).join('')}
        </div></div>`).join('');
  },
  toggleGroup(gid){
    if(this.openGroups.has(gid))this.openGroups.delete(gid);else this.openGroups.add(gid);
    const p=document.querySelector(`[data-group="${gid}"]`), c=document.getElementById('children-'+gid);
    if(p)p.classList.toggle('open'); if(c)c.style.display=this.openGroups.has(gid)?'':'none';
  },
  toggleSidebar(){document.getElementById('sidebar').classList.toggle('collapsed');},

  renderTabs(){
    document.getElementById('tabsBar').innerHTML=this.tabs.map(t=>`
      <div class="tab ${t.id===this.current?'active':''}" data-page="${t.id}" onclick="App.switchTab('${t.id}')">
        <span>${esc(t.title)}</span>${t.id!=='home'?`<span class="tclose" onclick="event.stopPropagation();App.closeTab('${t.id}')">×</span>`:''}</div>`).join('');
  },
  switchTab(id){this.current=id;this.renderTabs();this.renderContent();this.syncMenu();},
  closeTab(id){this.tabs=this.tabs.filter(t=>t.id!==id);if(this.current===id)this.current=this.tabs[this.tabs.length-1].id;this.renderTabs();this.renderContent();this.syncMenu();},
  go(id){
    if(!this.tabs.find(t=>t.id===id))this.tabs.push({id,title:NAME_MAP[id]||'首页'});
    this.current=id;this.renderTabs();this.renderContent();this.syncMenu();
    const g=MENU.find(g=>g.children.some(c=>c.id===id));
    if(g&&!this.openGroups.has(g.id))this.toggleGroup(g.id);
  },
  syncMenu(){
    document.querySelectorAll('.menu-child').forEach(c=>c.classList.toggle('active',c.dataset.id===this.current));
    document.querySelectorAll('.menu-parent').forEach(p=>p.classList.remove('active'));
  },

  renderContent(){
    const c=document.getElementById('content'), page=getPage(this.current);
    if(page.type==='home')c.innerHTML=renderHome();
    else if(page.type==='table')c.innerHTML=renderTable(page,this.current);
    else if(page.type==='dashboard')c.innerHTML=renderDashboard(this.current);
    else c.innerHTML=renderChartPage(this.current);
    this.bindFilters(this.current);
  },
  refresh(){const c=document.getElementById('content'),page=getPage(this.current);if(page.type==='table')c.innerHTML=renderTable(page,this.current);this.bindFilters(this.current);this.toast('数据已刷新');},
  bindFilters(id){
    document.querySelectorAll('[data-filter]').forEach(el=>{
      const h=()=>{(App.filters[id]||(App.filters[id]={}))[el.dataset.filter]=el.value;};
      el.addEventListener('input',h);el.addEventListener('change',h);
    });
    document.querySelectorAll('[data-op]').forEach(el=>{el.addEventListener('change',()=>{(App.filters[id]||(App.filters[id]={}))[el.dataset.op]=el.value;});});
  },
  doSearch(id){this.filters[id]=this.filters[id]||{};this.filters[id]._page=1;this.renderContent();this.toast('查询完成');},
  resetFilter(id){this.filters[id]={};this.renderContent();},
  quickSearch(id,kw){this.filters[id]=this.filters[id]||{};this.filters[id]._kw=kw;this.filters[id]._page=1;this.renderContent();},
  setPage(id,p){this.filters[id]=this.filters[id]||{};this.filters[id]._page=p;this.renderContent();},
  setRadio(key,val){(this.filters[this.current]||(this.filters[this.current]={}))[key]=val;this.renderContent();},
  setQuick(label,val){const f=this.filters[this.current]||(this.filters[this.current]={});f['_q_'+label]=val;
    const today=new Date();const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}`;
    let s=fmt(today),e=fmt(today);
    if(val==='本周'){const d=new Date(today);d.setDate(d.getDate()-((d.getDay()+6)%7));s=fmt(d);}
    if(val==='本月'){s=fmt(new Date(today.getFullYear(),today.getMonth(),1));}
    if(val==='最近三个月'){s=fmt(new Date(today.getFullYear(),today.getMonth()-3,1));}
    f['_ds_'+label]=s;f['_de_'+label]=e;this.renderContent();},
  setSub(id,t){(this.filters[id]||(this.filters[id]={}))._sub=t;this.renderContent();},
  sortCol(id,k){
    const s=this.sortState[id]||{};s.asc=s.k===k?!s.asc:true;s.k=k;this.sortState[id]=s;
    const page=getPage(id);if(page.type==='table')page.dataset.sort((a,b)=>((a[k]>b[k])?1:(a[k]<b[k]?-1:0))*(s.asc?1:-1));
    this.renderContent();this.toast(`已按「${k}」${s.asc?'升序':'降序'}排列`);
  },
  toggleAll(checked){document.querySelectorAll('.row-cb').forEach(cb=>cb.checked=checked);},
  toggleRow(){const all=[...document.querySelectorAll('.row-cb')],cbAll=document.getElementById('cbAll');if(cbAll)cbAll.checked=all.length>0&&all.every(c=>c.checked);},

  toolBtn(b){
    if(b.includes('新增')||b==='添加'||b==='新增报废'){this.openForm(this.current,null,b);return;}
    if(b.includes('删除')){this.batchDelete(this.current);return;}
    if(b==='导出'){this.exportData(this.current);return;}
    this.toast(b+'：演示功能');
  },
  rowAction(id,idx,action){
    const page=getPage(id);if(page.type!=='table')return;const row=page.dataset[idx];if(!row)return;
    if(action==='查看'){this.viewDetail(id,row);return;}
    if(['修改','编辑','处理','执行','审批','审核','盘点','下机','外修','维修','库位移动','料号转换'].includes(action)){this.openForm(id,row,action);return;}
    if(action==='删除'){this.confirm(`确定要删除「${row.name||row.no||row.code||'该记录'}」吗？删除后不可恢复。`,()=>{page.dataset.splice(idx,1);this.refresh();this.toast('删除成功');});return;}
    this.toast(action+'：演示功能');
  },
  more(id,idx){this.showModal('更多操作',`<div style="display:flex;flex-direction:column;gap:8px">${['查看详细信息','编辑记录','复制新增','打印记录','导出PDF'].map(a=>`<button class="btn" style="justify-content:flex-start" onclick="App.toast('${a}：演示功能')">${a}</button>`).join('')}</div>`,'<button class="btn" onclick="App.closeModal()">取消</button>');},
  viewDetail(id,row){
    // 真实系统“查看”同样用分组表单展示，只读
    this.showForm(id,row,'查看',true);
  },
  batchDelete(id){
    const checked=[...document.querySelectorAll('.row-cb:checked')];
    if(!checked.length){this.toast('请先选择要删除的记录',true);return;}
    this.confirm(`确定要删除选中的 ${checked.length} 条记录吗？`,()=>{
      const page=getPage(id),ps=page.pageSize||10,p=this.filters[id]?._page||1;
      checked.map(c=>(p-1)*ps+parseInt(c.dataset.i)).sort((a,b)=>b-a).forEach(i=>page.dataset.splice(i,1));
      this.refresh();this.toast(`已删除 ${checked.length} 条记录`);
    });
  },
  exportData(id){
    const page=getPage(id);if(page.type!=='table'){this.toast('当前页面不支持导出');return;}
    const cols=page.cols.filter(c=>c.k&&!c.cb&&c.k!=='_op');
    let csv=cols.map(c=>c.t).join(',')+'\n';
    page.dataset.slice(0,100).forEach(r=>csv+=cols.map(c=>`"${String(r[c.k]||'').replace(/"/g,'""')}"`).join(',')+'\n');
    const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=(NAME_MAP[id]||id)+'.csv';a.click();this.toast('导出成功');
  },

  /* ---------- 真实系统表单：分组 Tab + 必填 + 类型化控件 + 保存三按钮 ---------- */
  _formFieldHtml(f,row,readonly){
    const v=row?(row[f.key]!=null?row[f.key]:''):'';
    const req=f.required?'<i class="req">*</i>':'';
    const full=f.full?' fform-full':'';
    let ctl='';
    if(f.type==='select'){
      const opts=(f.opts||[]).map(o=>`<option ${String(v)===String(o)?'selected':''}>${esc(o)}</option>`).join('');
      ctl=`<select name="${f.key}" ${readonly?'disabled':''}><option value="">请选择</option>${opts}</select>`;
    } else if(f.type==='date'){
      ctl=`<input type="text" class="fdate" name="${f.key}" value="${esc(v)}" placeholder="请选择日期" ${readonly?'readonly':''}>`;
    } else if(f.type==='number'){
      ctl=`<input type="number" name="${f.key}" value="${esc(v)}" ${readonly?'readonly':''}>`;
    } else if(f.type==='textarea'){
      ctl=`<textarea name="${f.key}" ${readonly?'readonly':''}>${esc(v)}</textarea>`;
    } else if(f.type==='upload'){
      ctl=`<div class="f-upload"><div class="f-up-btn">＋<span>点击上传</span></div><div class="f-up-hint">${esc(f.hint||'图片大小限制：10MB　最大图片数：9　图片支持格式：.jpg,.png,.jpeg,.bmp,.gif,.tif')}</div></div>`;
    } else {
      ctl=`<input type="text" name="${f.key}" value="${esc(v)}" ${readonly?'readonly':''}>`;
    }
    return `<div class="fform-item${full}"><label>${req}${esc(f.label)}</label><div class="fform-ctrl">${ctl}</div></div>`;
  },
  _subTableHtml(def,readonly){
    if(!def) return '';
    const cols=(def.cols||def.subCols||[]);
    const rows=(def.rows||def.subRows||[]);
    const head=cols.map(c=>`<th>${esc(c.label||c.t)}</th>`).join('');
    const body=rows.length?rows.map(r=>'<tr>'+cols.map(c=>`<td>${esc(r[c.key||c.k]||'')}</td>`).join('')+'</tr>').join('')
      :`<tr><td colspan="${cols.length}" class="fsub-empty">暂无数据</td></tr>`;
    const addBtn=readonly?'':`<button class="btn btn-sm" onclick="App.formSubAdd()">＋新增</button><button class="btn btn-sm btn-danger" onclick="App.formSubDel()">－删除</button>`;
    return `<div class="fsubtable"><div class="fsub-head"><b>${esc(def.title||'明细')}</b><span>${addBtn}</span></div>
      <div class="table-wrap"><table class="grid"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div></div>`;
  },
  showForm(id,row,action,readonly){
    const form=getForm(id);
    const isEdit=!!row;
    const prefix=form.titlePrefix||'+新增';
    const verb=readonly?'查看':(isEdit?(action||'修改'):prefix);
    const title=`${verb}-${form.title}`;
    this._formCtx={id,row,form};

    const groups=form.groups||[];
    const hasTabs=groups.length>1;
    const tabsHtml=hasTabs?`<div class="form-tabs">${groups.map((g,i)=>`<span class="${i===0?'active':''}" onclick="App.switchFTab(${i})">${esc(g.name)}</span>`).join('')}</div>`:'';
    const panesHtml=groups.map((g,gi)=>`<div class="form-pane" data-pane="${gi}" style="${gi>0?'display:none':''}">
      <div class="fform-grid">${(g.fields||[]).map(f=>this._formFieldHtml(f,row,readonly)).join('')}</div>
      ${gi===0?this._subTableHtml(form.subtable||(form.subtabs?{title:form.subtabs[0],cols:form.subCols,rows:form.subRows}:null),readonly):''}
    </div>`).join('');
    const body=`<div class="real-form">${tabsHtml}<div class="form-panes">${panesHtml}</div></div>`;
    const foot=readonly
      ?`<button class="btn" onclick="App.closeModal()">关闭</button>`
      :`<button class="btn" onclick="App.closeModal()">取消</button><button class="btn btn-primary" onclick="App.submitForm('${id}',false)">保存不退出</button><button class="btn btn-primary" onclick="App.submitForm('${id}',true)">保存并退出</button>`;
    this.showModal(title,body,foot,'xwide');
  },
  openForm(id,row,action){ this.showForm(id,row,action,false); },
  switchFTab(i){
    document.querySelectorAll('.form-tabs span').forEach((s,j)=>s.classList.toggle('active',j===i));
    document.querySelectorAll('.form-pane').forEach((p,j)=>p.style.display=j===i?'':'none');
  },
  formSubAdd(){ this.toast('子表明细：点击新增一行（演示）'); },
  formSubDel(){ this.toast('子表明细：删除选中行（演示）'); },
  submitForm(id,exit){
    const data={};document.querySelectorAll('#modal [name]').forEach(el=>{if(!el.disabled)data[el.name]=el.value;});
    const page=getPage(id);
    if(page.type==='table'){
      if(this._formCtx&&this._formCtx.row) Object.assign(this._formCtx.row,data);
      else page.dataset.unshift({...data,org:ORG});
    }
    this.toast('保存成功');
    if(exit){ this.closeModal(); this.refresh(); }
  },

  showModal(title,body,foot,wide){
    document.getElementById('modalTitle').textContent=title;
    document.getElementById('modalBody').innerHTML=body;
    document.getElementById('modalFoot').innerHTML=foot||'<button class="btn btn-primary" onclick="App.closeModal()">知道了</button>';
    const m=document.getElementById('modal');
    m.classList.remove('wide','xwide');
    if(wide==='xwide') m.classList.add('xwide');
    else if(wide) m.classList.add('wide');
    document.getElementById('modalMask').classList.remove('hidden');
  },
  closeModal(){document.getElementById('modalMask').classList.add('hidden');},
  confirm(msg,cb){this._confirmCb=cb;this.showModal('操作确认',`<div style="padding:10px 0;font-size:14px;line-height:1.7">⚠ ${esc(msg)}</div>`,'<button class="btn" onclick="App.closeModal()">取消</button><button class="btn btn-primary" onclick="App.doConfirm()">确定</button>');},
  doConfirm(){this.closeModal();if(this._confirmCb){this._confirmCb();this._confirmCb=null;}},
  toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.classList.toggle('err',!!err);t.classList.remove('hidden');clearTimeout(this._tt);this._tt=setTimeout(()=>t.classList.add('hidden'),2200);},
  userMenu(e){
    e.stopPropagation();
    this.showModal('当前用户',`<div class="detail-grid">
      <div class="detail-item"><span class="dk">姓名</span><span class="dv">李元龙</span></div>
      <div class="detail-item"><span class="dk">工号</span><span class="dv">320125</span></div>
      <div class="detail-item"><span class="dk">所属组织</span><span class="dv">${ORG}</span></div>
      <div class="detail-item"><span class="dk">角色</span><span class="dv">设备管理员</span></div></div>`,
      '<button class="btn" onclick="App.closeModal()">关闭</button><button class="btn btn-danger" onclick="App.logout();App.closeModal()">退出登录</button>');
  },

  renderMessages(){
    const msgs=[
      {t:'授权到期提醒',d:'软件授权期限还剩下 <a>9天23小时43分14秒</a>，请提前与授权厂商联系。',time:'2026-09-20 14:21:31'},
      {t:'设备维修提醒',d:'设备 <a>DE线自动贴标机</a> 维修工单已超时未处理，请尽快安排维修人员。',time:'2026-11-16 09:30:12'},
      {t:'备件库存预警',d:'备件 <a>轴承6305</a> 当前库存低于最小安全库存，请及时补充。',time:'2026-11-15 16:45:08'},
      {t:'保养计划提醒',d:'设备 <a>1号空压机</a> 二级保养计划将于 3 日后到期。',time:'2026-11-14 11:20:35'}
    ];
    document.getElementById('msgBody').innerHTML=msgs.map(m=>`<div class="msg-item"><div class="mt">${m.t}</div><div class="md">${m.d}</div><div class="mtime">${m.time}</div></div>`).join('');
  },
  openMessages(){document.getElementById('msgMask').classList.remove('hidden');document.getElementById('msgDrawer').classList.remove('hidden');},
  closeMessages(){document.getElementById('msgMask').classList.add('hidden');document.getElementById('msgDrawer').classList.add('hidden');},
  readAll(){this.toast('已全部标记为已读');this.closeMessages();},
  toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();else document.exitFullscreen&&document.exitFullscreen();}
};
